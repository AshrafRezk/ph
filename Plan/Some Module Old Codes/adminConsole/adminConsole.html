<template>
    <section class="admin-console">
        <header class="admin-header">
            <div class="admin-header-icon" aria-hidden="true">
                <lightning-icon icon-name="utility:settings" size="medium"></lightning-icon>
            </div>
            <div class="admin-header-text">
                <h1 class="admin-header-title">Admin Console</h1>
                <p class="admin-header-subtitle">
                    Manage pricing, plans, orders, salary rules, and operational configurations.
                </p>
            </div>
        </header>

        <div class="admin-body">
            <div class="admin-search">
                <lightning-input type="search"
                                 variant="label-hidden"
                                 label="Search modules"
                                 placeholder="Search modules..."
                                 value={searchTerm}
                                 onchange={handleSearch}>
                </lightning-input>
            </div>

            <div class="admin-section-header">
                <span class="admin-section-chevron" aria-hidden="true">
                    <lightning-icon icon-name="utility:chevrondown" size="x-small"></lightning-icon>
                </span>
                <span class="admin-section-label">General</span>
                <span class="admin-section-count">{moduleCount} modules</span>
            </div>

            <div class="admin-cards-grid">
                <template for:each={cardsView} for:item="card">
                    <article key={card.id}
                             class={card.cardClass}
                             data-card-id={card.id}
                             onclick={handleCardClick}
                             onkeydown={handleCardClick}
                             role="button"
                             tabindex="0"
                             aria-label={card.ariaLabel}>
                        <div class="admin-card-icon-panel" aria-hidden="true">
                            <lightning-icon icon-name={card.icon}
                                            size="medium"
                                            class="admin-card-icon">
                            </lightning-icon>
                        </div>
                        <div class="admin-card-body">
                            <span class="admin-card-pill">Current</span>
                            <h3 class="admin-card-title">{card.title}</h3>
                            <p class="admin-card-desc">{card.description}</p>
                        </div>
                        <div class="admin-card-chevron" aria-hidden="true">
                            <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                        </div>
                    </article>
                </template>
            </div>

            <template if:false={hasResults}>
                <div class="admin-empty">
                    <p>No modules match your search.</p>
                </div>
            </template>
        </div>
    </section>

    <!-- Modal Container: one blur behind this modal when no child modal is open -->
    <template if:true={showModal}>
        <div class="admin-console-modal-wrapper">
            <div class={adminConsoleBackdropClass} role="presentation" aria-hidden="true"></div>
            <section role="dialog"
                     tabindex="-1"
                     class="slds-modal slds-fade-in-open slds-modal_large admin-console-modal"
                     aria-labelledby="modal-heading-01"
                     aria-modal="true"
                     aria-describedby="modal-content-id-1"
                     onchildmodalopen={handleChildModalOpen}
                     onchildmodalclose={handleChildModalClose}>
                <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeModal}>
                        <lightning-icon icon-name="utility:close"
                                       alternative-text="close"
                                       size="small">
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
                        {modalTitle}
                    </h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <template if:true={isPricingManager}>
                        <c-price-list-discount-rule-manager></c-price-list-discount-rule-manager>
                    </template>
                    <template if:true={isPlanManager}>
                        <c-plan-cycle-manager></c-plan-cycle-manager>
                    </template>
                    <template if:true={isSalaryAdmin}>
                        <c-salary-admin-manager></c-salary-admin-manager>
                    </template>
                    <template if:true={isOrdersManagementMenu}>
                        <div class="orders-management-menu">
                            <div class="admin-card admin-card--orange orders-management-item"
                                 data-view="massImport"
                                 onclick={handleOrdersManagementItemClick}>
                                <div class="admin-card-icon-panel" aria-hidden="true">
                                    <lightning-icon icon-name="utility:upload" size="medium" class="admin-card-icon"></lightning-icon>
                                </div>
                                <div class="admin-card-body">
                                    <h3 class="admin-card-title">Mass Order Import</h3>
                                    <p class="admin-card-desc">Import orders and line items from a single CSV file.</p>
                                </div>
                                <div class="admin-card-chevron" aria-hidden="true">
                                    <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                                </div>
                            </div>
                        </div>
                    </template>
                    <template if:true={isOrdersManagementMassImport}>
                        <div class="slds-m-bottom_small">
                            <lightning-button label="Back" icon-name="utility:back" onclick={handleOrdersManagementBack} variant="neutral"></lightning-button>
                        </div>
                        <c-order-mass-import></c-order-mass-import>
                    </template>
                </div>
                </div>
            </section>
        </div>
    </template>
</template>
