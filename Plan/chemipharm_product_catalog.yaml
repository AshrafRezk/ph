# Chemipharm product catalog — source of truth for Apex seed + CLM alignment.
# Core brands from Chemipharm Presentation Deck; strengths/forms from CPI Product List.
#
# Hierarchy:
#   Brand (parent)
#     ├── Detail          — commercial SKU (form + UoM + qty/unit + box qty)
#     ├── Sample          — leave-behind sample (same dosing fields as Detail)
#     └── Brand Reminder  — brochure or bug/giveaway (no dosing fields)
#
# product_type values: Brand | Detail | Sample | Brand Reminder
# brand_reminder_kind values (Brand Reminder only): Brochure | Bug

catalog:
  manufacturer: Chemipharm
  currency: EGP
  product_types:
    - Brand
    - Detail
    - Sample
    - Brand Reminder
  brand_reminder_kinds:
    - Brochure
    - Bug
  required_on_detail_and_sample:
    - form
    - unit_of_measure
    - quantity_per_unit
    - box_quantity

products:

