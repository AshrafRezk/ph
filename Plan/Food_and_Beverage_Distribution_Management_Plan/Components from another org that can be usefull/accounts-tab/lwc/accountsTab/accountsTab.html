<template>
    <lightning-card title="Accounts" icon-name="standard:account">
        <div class="accounts-shell">
            <div class={toolbarClass}>
                <lightning-input
                    class="accounts-search"
                    type="search"
                    label="Search accounts"
                    variant="label-hidden"
                    placeholder="Search by name, specialty, city..."
                    value={searchTerm}
                    onchange={handleSearchChange}
                    onkeyup={handleSearchKeyUp}
                ></lightning-input>

                <template if:false={isCompactView}>
                    <lightning-combobox
                        class="toolbar-filter"
                        label="Plan cycle"
                        variant="label-hidden"
                        value={scope}
                        options={scopeOptions}
                        onchange={handleScopeChange}
                    ></lightning-combobox>

                    <lightning-combobox
                        class="toolbar-filter"
                        label="Record type"
                        variant="label-hidden"
                        value={recordType}
                        options={recordTypeOptions}
                        onchange={handleRecordTypeChange}
                    ></lightning-combobox>

                    <lightning-combobox
                        class="toolbar-filter"
                        label="Classification"
                        variant="label-hidden"
                        value={classification}
                        options={classificationOptions}
                        onchange={handleClassificationChange}
                    ></lightning-combobox>

                    <lightning-combobox
                        class="toolbar-filter"
                        label="Sort by"
                        variant="label-hidden"
                        value={sortBy}
                        options={sortOptions}
                        onchange={handleSortChange}
                    ></lightning-combobox>
                </template>

                <div class="slds-col_bump-left toolbar-actions">
                    <template if:true={isCompactView}>
                        <lightning-button-icon
                            icon-name="utility:filterList"
                            alternative-text="Show filters"
                            onclick={handleToggleFilters}
                        ></lightning-button-icon>
                    </template>
                    <lightning-button-icon
                        icon-name="utility:refresh"
                        alternative-text="Refresh"
                        onclick={handleRefresh}
                    ></lightning-button-icon>
                    <lightning-button-group>
                        <lightning-button
                            label="List View"
                            variant={listVariant}
                            onclick={handleShowList}
                        ></lightning-button>
                        <lightning-button
                            label="Map View"
                            variant={mapVariant}
                            onclick={handleShowMap}
                        ></lightning-button>
                    </lightning-button-group>
                </div>
            </div>

            <div class="account-collections">
                <div class="collections-section-title">My lists</div>
                <div class="collection-chips-row">
                    <button type="button" class={allAccountsChipClass} onclick={handleShowAllAccounts}>
                        All accounts
                    </button>
                    <template for:each={collectionChips} for:item="col">
                        <button
                            key={col.id}
                            type="button"
                            class={col.chipClass}
                            data-collection-id={col.id}
                            onclick={handleSelectCollection}
                            title={col.title}
                        >
                            {col.label}
                        </button>
                    </template>
                    <template if:false={hasPlannerCollections}>
                        <span class="collections-empty-hint">Create lists in Field Rep Planner</span>
                    </template>
                </div>
            </div>

            <div class={summaryCardsClass}>
                <article class="summary-card">
                    <span class="summary-value">{summary.totalCount}</span>
                    <span class="summary-label">Total Accounts</span>
                </article>
                <article class="summary-card">
                    <span class="summary-value">{summary.inPlanCount}</span>
                    <span class="summary-label">In Plan Cycle</span>
                </article>
                <article class="summary-card">
                    <span class="summary-value">{summary.outPlanCount}</span>
                    <span class="summary-label">Out of Plan Cycle</span>
                </article>
                <article class="summary-card summary-card-warn">
                    <span class="summary-value">{summary.behindPaceCount}</span>
                    <span class="summary-label">Behind / Critical Pace</span>
                </article>
            </div>

            <p class="list-meta">{countLabel} · {summary.monthLabel}</p>

            <template if:true={errorMessage}>
                <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
            </template>

            <template if:true={isListView}>
                <template if:true={isCompactView}>
                    <div class="oce-shell">
                        <aside class={sidebarClass}>
                            <div class="oce-sidebar-inner">
                                <div class="oce-segment" role="tablist">
                                    <button
                                        class={listsSegmentClass}
                                        role="tab"
                                        aria-selected={isListsPanel}
                                        onclick={handleShowListsPanel}
                                    >Lists</button>
                                    <button
                                        class={filtersSegmentClass}
                                        role="tab"
                                        aria-selected={isFiltersPanel}
                                        onclick={handleShowFiltersPanel}
                                    >Filters</button>
                                </div>

                                <template if:true={isListsPanel}>
                                    <p class="oce-sidebar-heading">Lists</p>
                                    <div class="oce-sidebar-collections">
                                        <p class="oce-sidebar-subheading">My lists</p>
                                        <div class="collection-chips-row">
                                            <button type="button" class={allAccountsChipClass} onclick={handleShowAllAccounts}>
                                                All accounts
                                            </button>
                                            <template for:each={collectionChips} for:item="col">
                                                <button
                                                    key={col.id}
                                                    type="button"
                                                    class={col.chipClass}
                                                    data-collection-id={col.id}
                                                    onclick={handleSelectCollection}
                                                    title={col.title}
                                                >
                                                    {col.label}
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                    <p class="oce-sidebar-heading oce-sidebar-heading-spaced">Plan cycle</p>
                                    <ul class="oce-nav-list" role="list">
                                        <template for:each={listNavItems} for:item="item">
                                            <li key={item.value} class="oce-nav-item">
                                                <button
                                                    class={item.buttonClass}
                                                    data-value={item.value}
                                                    onclick={handleListNavSelect}
                                                >{item.label}</button>
                                            </li>
                                        </template>
                                    </ul>
                                </template>

                                <template if:true={isFiltersPanel}>
                                    <p class="oce-sidebar-heading">Filters</p>
                                    <div class="oce-filter-field">
                                        <lightning-combobox
                                            label="Plan cycle"
                                            value={scope}
                                            options={scopeOptions}
                                            onchange={handleScopeChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="oce-filter-field">
                                        <lightning-combobox
                                            label="Record Type"
                                            value={recordType}
                                            options={recordTypeOptions}
                                            onchange={handleRecordTypeChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="oce-filter-field">
                                        <lightning-combobox
                                            label="Classification"
                                            value={classification}
                                            options={classificationOptions}
                                            onchange={handleClassificationChange}
                                        ></lightning-combobox>
                                    </div>
                                    <div class="oce-filter-field">
                                        <lightning-combobox
                                            label="Sort by"
                                            value={sortBy}
                                            options={sortOptions}
                                            onchange={handleSortChange}
                                        ></lightning-combobox>
                                    </div>

                                    <p class="oce-sidebar-heading oce-sidebar-heading-spaced">Type</p>
                                    <ul class="oce-nav-list" role="list">
                                        <template for:each={typeNavItems} for:item="item">
                                            <li key={item.value} class="oce-nav-item">
                                                <button
                                                    class={item.buttonClass}
                                                    data-value={item.value}
                                                    onclick={handleTypeNavSelect}
                                                >{item.label}</button>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                        </aside>

                        <section class="oce-main">
                            <c-accounts-tab-oce-list
                                rows={rows}
                                is-loading={isLoading}
                                sort-by={sortBy}
                                sort-direction={sortDirection}
                                onrowaction={handleOceRowAction}
                                onsorttoggle={handleOceSortToggle}
                            ></c-accounts-tab-oce-list>
                            <template if:true={showEmptyState}>
                                <p class="accounts-empty-state">No accounts match the current filters.</p>
                            </template>
                            <template if:true={showPagination}>
                                <div class="pagination-bar">
                                    <span class="pagination-range">{rangeLabel}</span>
                                    <div class="pagination-controls">
                                        <button
                                            type="button"
                                            class="page-btn"
                                            onclick={handlePreviousPage}
                                            disabled={isPrevDisabled}
                                        >Previous</button>
                                        <span class="page-label">{pageLabel}</span>
                                        <button
                                            type="button"
                                            class="page-btn"
                                            onclick={handleNextPage}
                                            disabled={isNextDisabled}
                                        >Next</button>
                                    </div>
                                </div>
                            </template>
                        </section>
                    </div>
                </template>

                <template if:false={isCompactView}>
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading accounts" size="medium"></lightning-spinner>
                    </template>
                    <div class="accounts-table-wrap">
                        <lightning-datatable
                            key={datatableKey}
                            key-field="accountId"
                            data={rows}
                            columns={columns}
                            hide-checkbox-column
                            show-row-number-column
                        ></lightning-datatable>
                        <template if:true={showEmptyState}>
                            <p class="accounts-empty-state">No accounts match the current filters.</p>
                        </template>
                        <template if:true={showPagination}>
                            <div class="pagination-bar">
                                <span class="pagination-range">{rangeLabel}</span>
                                <div class="pagination-controls">
                                    <button
                                        type="button"
                                        class="page-btn"
                                        onclick={handlePreviousPage}
                                        disabled={isPrevDisabled}
                                    >Previous</button>
                                    <span class="page-label">{pageLabel}</span>
                                    <button
                                        type="button"
                                        class="page-btn"
                                        onclick={handleNextPage}
                                        disabled={isNextDisabled}
                                    >Next</button>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </template>

            <template if:true={isMapView}>
                <div class="map-view-layout">
                    <aside class="map-account-list">
                        <div class="map-list-header">
                            <span class="map-list-title">Accounts</span>
                            <span class="map-list-count">{mapListCountLabel}</span>
                        </div>
                        <template if:true={isLoading}>
                            <div class="map-list-loading">
                                <lightning-spinner alternative-text="Loading accounts" size="small"></lightning-spinner>
                            </div>
                        </template>
                        <template if:false={isLoading}>
                            <template if:true={hasMapListItems}>
                                <ul class="map-account-items" role="list">
                                    <template for:each={mapListItems} for:item="item">
                                        <li
                                            key={item.accountId}
                                            class={item.itemClass}
                                            data-account-id={item.accountId}
                                            onclick={handleMapListSelect}
                                        >
                                            <div class="map-account-item-body">
                                                <div class="map-account-item-top">
                                                    <span class={item.riskDotClass} title={item.agentforceRisk}></span>
                                                    <span class="map-account-type">{item.typeLabel}</span>
                                                    <lightning-badge
                                                        label={item.classification}
                                                        class="map-account-badge"
                                                    ></lightning-badge>
                                                </div>
                                                <p class="map-account-name">{item.accountName}</p>
                                                <p class="map-account-subtitle">{item.subtitle}</p>
                                            </div>
                                            <lightning-button-icon
                                                icon-name="utility:new_window"
                                                alternative-text="View account"
                                                variant="bare"
                                                size="small"
                                                data-account-id={item.accountId}
                                                onclick={handleMapListViewAccount}
                                            ></lightning-button-icon>
                                        </li>
                                    </template>
                                </ul>
                            </template>
                            <template if:false={hasMapListItems}>
                                <p class="map-list-empty">No accounts match the current filters.</p>
                            </template>
                            <template if:true={showMapPagination}>
                                <div class="map-pagination-bar">
                                    <span class="pagination-range">{mapRangeLabel}</span>
                                    <div class="pagination-controls">
                                        <button
                                            type="button"
                                            class="page-btn"
                                            onclick={handleMapPreviousPage}
                                            disabled={isMapPrevDisabled}
                                        >Previous</button>
                                        <span class="page-label">{mapPageLabel}</span>
                                        <button
                                            type="button"
                                            class="page-btn"
                                            onclick={handleMapNextPage}
                                            disabled={isMapNextDisabled}
                                        >Next</button>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </aside>
                    <section class="map-panel">
                        <div class="map-legend">
                            <span class="legend-item"><span class="legend-pin legend-pin-high"></span> High risk</span>
                            <span class="legend-item"><span class="legend-pin legend-pin-med"></span> Med risk</span>
                            <span class="legend-item"><span class="legend-pin legend-pin-low"></span> Low risk</span>
                        </div>
                        <div class="accounts-map" lwc:dom="manual"></div>
                    </section>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
