[build]
  publish = "apps/shell/dist"
  command = "npm run build -w @osr/shell"
  functions = "netlify/functions"
  # Skip Netlify builds when the commit only touches Salesforce/Plan/etc.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[[redirects]]
  from = "/oauth/callback"
  to = "/index.html"
  status = 200

# SPA fallback. Netlify matches /.netlify/functions/* before redirects,
# so this catch-all does not swallow the sf-token proxy.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
