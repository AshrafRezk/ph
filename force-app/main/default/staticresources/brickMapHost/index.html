<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bricks map</title>
<link rel="stylesheet" href="brickMap.css" />
</head>
<body>
<div id="stage">
    <div id="map"></div>

    <div class="ctrl tl">
        <div class="seg" role="group" aria-label="Base map">
            <button class="btn is-on" data-act="streets" type="button" aria-pressed="true">Map</button>
            <button class="btn" data-act="satellite" type="button" aria-pressed="false">
                <svg viewBox="0 0 16 16"><path d="M5.6 1 8 3.4 6.6 4.8 9.2 7.4l1.4-1.4L13 8.4 9.4 12 7 9.6l1.4-1.4-2.6-2.6L4.4 7 2 4.6 5.6 1Zm6.9 8.6 1 .2a5 5 0 0 1-3.7 4.2l-.2-1a4 4 0 0 0 2.9-3.4Zm2-.3 1 .2A7 7 0 0 1 10.2 15l-.2-1a6 6 0 0 0 4.5-4.7Z"/></svg>Satellite
            </button>
        </div>
        <div class="seg">
            <button class="btn is-on" data-act="points" type="button" aria-pressed="true" title="Show distributor clients by where they were placed">
                <svg viewBox="0 0 16 16"><circle cx="4" cy="5" r="2"/><circle cx="12" cy="4" r="2"/><circle cx="8" cy="10" r="2"/><circle cx="3" cy="12.5" r="1.5"/><circle cx="13" cy="11.5" r="1.5"/></svg>Clients
            </button>
            <button class="btn" data-act="locate" type="button" aria-pressed="false" title="Click the map to see which brick a place is in">
                <svg viewBox="0 0 16 16"><path d="M7.25 0h1.5v2.07A6 6 0 0 1 13.93 7.25H16v1.5h-2.07a6 6 0 0 1-5.18 5.18V16h-1.5v-2.07a6 6 0 0 1-5.18-5.18H0v-1.5h2.07A6 6 0 0 1 7.25 2.07V0ZM8 3.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Zm0 2.5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>Find brick
            </button>
        </div>
    </div>
    <div class="ctrl tr">
        <div class="stack">
            <button class="btn" data-act="in" type="button" title="Zoom in">+</button>
            <button class="btn" data-act="out" type="button" title="Zoom out">&minus;</button>
            <button class="btn" data-act="home" type="button" title="Show all bricks">
                <svg viewBox="0 0 16 16"><path d="M8 1.5 1.5 7h2v7h3.5V10h2v4h3.5V7h2L8 1.5Z"/></svg>
            </button>
        </div>
    </div>

    <div class="legend" id="legend"></div>
    <div class="footnote" role="note">
        <span class="osm">© OpenStreetMap contributors</span>
        <span class="esri">Imagery © Esri, Maxar, Earthstar Geographics</span>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <div class="zone-bar" id="zoneBar" role="toolbar" aria-label="Edit brick region" hidden>
        <div class="copy">
            <span class="t" id="zoneTitle"></span>
            <span class="h" id="zoneHint"></span>
            <span class="n" id="zoneStats"></span>
            <span class="w" id="zoneWarn" hidden></span>
        </div>
        <div class="acts">
            <label class="snap"><input type="checkbox" id="snap" checked /> Snap to neighbours</label>
            <button class="btn" id="zoneUndo" type="button" title="Undo (Ctrl+Z)">Undo</button>
            <button class="btn" id="zoneBox" type="button" hidden>Start with a box</button>
            <button class="btn" id="zonePart" type="button" hidden>Add part</button>
            <button class="btn" id="zoneFinish" type="button" hidden>Close outline</button>
            <button class="btn danger" id="zoneRemove" type="button" hidden>Remove region</button>
            <button class="btn" id="zoneCancel" type="button">Cancel</button>
            <button class="btn is-on" id="zoneSave" type="button">Save region</button>
        </div>
    </div>
</div>
<script src="brickGeometry.js"></script>
<script src="brickMap.js"></script>
</body>
</html>
