<template>
    <section class="admin-console">
        <header class="admin-header">
            <div class="admin-header-icon" aria-hidden="true">
                <lightning-icon icon-name="utility:settings" size="medium"></lightning-icon>
            </div>
            <div class="admin-header-text">
                <h1 class="admin-header-title">Admin Console</h1>
                <p class="admin-header-subtitle">
                    Open a module to configure the field app, content, territories, targets, sales loads, and planner rules.
                </p>
            </div>
        </header>

        <div class="admin-body">
            <div class="admin-search">
                <lightning-input
                    type="search"
                    variant="label-hidden"
                    label="Search modules"
                    placeholder="Search modules, e.g. samples, holidays, مدير المنتجات"
                    value={searchTerm}
                    onchange={handleSearch}
                ></lightning-input>
            </div>

            <p class="admin-module-total" aria-live="polite">{moduleTotalLabel}</p>

            <template for:each={sectionsView} for:item="section">
                <section key={section.id} class="admin-group" aria-labelledby={section.labelId}>
                    <div class="admin-section-header">
                        <h2 class="admin-section-heading">
                            <button
                                type="button"
                                class="admin-section-toggle"
                                data-group-id={section.id}
                                aria-expanded={section.ariaExpanded}
                                aria-controls={section.gridId}
                                title={section.toggleLabel}
                                onclick={handleToggleGroup}
                            >
                                <span class="admin-section-chevron" aria-hidden="true">
                                    <lightning-icon icon-name={section.chevronIcon} size="x-small"></lightning-icon>
                                </span>
                                <span class="admin-section-label" id={section.labelId}>{section.label}</span>
                                <span class="admin-section-count">{section.countLabel}</span>
                            </button>
                        </h2>
                    </div>
                    <template if:true={section.expanded}>
                    <div class="admin-cards-grid" id={section.gridId}>
                        <template for:each={section.cards} for:item="card">
                            <article
                                key={card.id}
                                class={card.cardClass}
                                data-card-id={card.id}
                                onclick={handleCardClick}
                                onkeydown={handleCardClick}
                                role="button"
                                tabindex="0"
                                aria-label={card.ariaLabel}
                            >
                                <div class="admin-card-icon-panel" aria-hidden="true">
                                    <lightning-icon icon-name={card.icon} size="medium" class="admin-card-icon"></lightning-icon>
                                </div>
                                <div class="admin-card-body">
                                    <h3 class="admin-card-title">{card.title}</h3>
                                    <p class="admin-card-desc">{card.description}</p>
                                </div>
                                <div class="admin-card-chevron" aria-hidden="true">
                                    <lightning-icon icon-name="utility:chevronright" size="x-small"></lightning-icon>
                                </div>
                            </article>
                        </template>
                    </div>
                    </template>
                </section>
            </template>

            <template if:false={hasResults}>
                <div class="admin-empty">
                    <p>No modules match “{searchTerm}”.</p>
                    <p class="admin-empty-hint">Try a shorter word, or open Help to search the step-by-step guides.</p>
                </div>
            </template>
        </div>
    </section>

    <template if:true={showModal}>
        <div class="admin-console-modal-wrapper" onkeydown={handleModalKeydown}>
            <div class="admin-console-backdrop" role="presentation" aria-hidden="true"></div>
            <section
                role="dialog"
                tabindex="-1"
                class={modalClass}
                aria-labelledby="modal-heading-01"
                aria-modal="true"
            >
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={closeModal}
                        >
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={isFieldAppManager}>
                            <c-field-app-manager></c-field-app-manager>
                        </template>
                        <template if:true={isHcpPortalManager}>
                            <c-hcp-portal-manager></c-hcp-portal-manager>
                        </template>
                        <template if:true={isCopilotTabs}>
                            <c-copilot-app-nav-admin></c-copilot-app-nav-admin>
                        </template>
                        <template if:true={isVisitTabs}>
                            <c-visit-tab-admin></c-visit-tab-admin>
                        </template>
                        <template if:true={isClmAdmin}>
                            <c-clm-admin-console embedded></c-clm-admin-console>
                        </template>
                        <template if:true={isRatingLayouts}>
                            <c-clm-rating-layout-editor></c-clm-rating-layout-editor>
                        </template>
                        <template if:true={isCoachingManagement}>
                            <c-coaching-template-manager></c-coaching-template-manager>
                        </template>
                        <template if:true={isTerritoryManagement}>
                            <c-territory-management-console></c-territory-management-console>
                        </template>
                        <template if:true={isSfeApprovers}>
                            <c-sfe-approver-admin></c-sfe-approver-admin>
                        </template>
                        <template if:true={isBricksManagement}>
                            <c-bricks-management-console></c-bricks-management-console>
                        </template>
                        <template if:true={isProductsManager}>
                            <c-product-territory-manager></c-product-territory-manager>
                        </template>
                        <template if:true={isSampleLogistics}>
                            <c-sample-logistics-console></c-sample-logistics-console>
                        </template>
                        <template if:true={isPlanManager}>
                            <c-plan-cycle-manager></c-plan-cycle-manager>
                        </template>
                        <template if:true={isCallTargetRules}>
                            <c-call-target-rule-manager></c-call-target-rule-manager>
                        </template>
                        <template if:true={isSalesPolicyAdmin}>
                            <c-sales-policy-admin></c-sales-policy-admin>
                        </template>
                        <template if:true={isMonthlyDataPack}>
                            <c-monthly-data-pack></c-monthly-data-pack>
                        </template>
                        <template if:true={isSalesExportMonth}>
                            <c-sales-export-month></c-sales-export-month>
                        </template>
                        <template if:true={isDistributorsManagement}>
                            <c-distributors-management></c-distributors-management>
                        </template>
                        <template if:true={isTargetGovernanceAdmin}>
                            <c-target-governance-admin></c-target-governance-admin>
                        </template>
                        <template if:true={isAccountManagement}>
                            <c-account-management-console></c-account-management-console>
                        </template>
                        <template if:true={isAccountDataQuality}>
                            <c-account-data-quality-console></c-account-data-quality-console>
                        </template>
                        <template if:true={isTargetMasterLists}>
                            <c-target-master-list-admin></c-target-master-list-admin>
                        </template>
                        <template if:true={isIntegrationsManagement}>
                            <c-integrations-management-console
                                onopenadminmodule={handleOpenAdminModule}
                            ></c-integrations-management-console>
                        </template>
                        <template if:true={isPromoGridManagement}>
                            <c-promo-grid-manager></c-promo-grid-manager>
                        </template>
                        <template if:true={isPublicHolidaysManagement}>
                            <c-public-holidays-manager></c-public-holidays-manager>
                        </template>
                        <template if:true={isPlannerRulesAdmin}>
                            <c-planner-rules-admin></c-planner-rules-admin>
                        </template>
                        <template if:true={isLearningModuleManagement}>
                            <c-learning-module-manager></c-learning-module-manager>
                        </template>
                        <template if:true={isMeetingsSetup}>
                            <c-meeting-setup-admin></c-meeting-setup-admin>
                        </template>
                        <template if:true={isServiceRequestTypesAdmin}>
                            <c-service-request-types-admin></c-service-request-types-admin>
                        </template>
                        <template if:true={isQuizManagement}>
                            <c-quiz-manager></c-quiz-manager>
                        </template>
                        <template if:true={isKpiTargetsAdmin}>
                            <c-kpi-targets-admin></c-kpi-targets-admin>
                        </template>
                        <template if:true={isChromeDataTools}>
                            <c-admin-chrome-data-tools></c-admin-chrome-data-tools>
                        </template>
                        <template if:true={isTrailheadLearning}>
                            <c-admin-trailhead-learning></c-admin-trailhead-learning>
                        </template>
                        <template if:true={isAdminConsoleHelp}>
                            <c-admin-console-help onopenadminmodule={handleOpenAdminModule}></c-admin-console-help>
                        </template>
                    </div>
                </div>
            </section>
        </div>
    </template>
</template>
