<template>
    <template if:true={showBanner}>
        <section class={hostClass} role="status" aria-live="polite">
            <div class="banner-main">
                <div class="banner-copy">
                    <div class="banner-kicker">
                        <span class="mode-badge">{modeBadge}</span>
                        <template if:true={isUpdateMode}>
                            <span class="update-pill">Update available</span>
                        </template>
                    </div>
                    <h2 class="banner-title">{titleText}</h2>
                    <p class="banner-body">{bodyText}</p>
                </div>
                <button
                    type="button"
                    class="dismiss-btn"
                    title="Dismiss"
                    aria-label="Dismiss"
                    onclick={handleDismiss}
                >
                    ?
                </button>
            </div>

            <div class="download-row" aria-label="Download the Offline Field app">
                <a class="download-btn" href={androidHref} target="_blank" rel="noopener noreferrer">
                    <span class="download-logo" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="28" height="28" focusable="false">
                            <path
                                fill="currentColor"
                                d="M17.6 9.48l1.84-3.18a.5.5 0 0 0-.86-.5l-1.9 3.28A7.9 7.9 0 0 0 12 8c-1.6 0-3.08.47-4.32 1.28L5.8 5.8a.5.5 0 1 0-.86.5l1.84 3.18C4.5 10.9 3.3 13.05 3.3 15.5v.3h17.4v-.3c0-2.45-1.2-4.6-3.1-6.02zM8.2 13.4a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zm7.6 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8zM5.1 17.2c.2 1.9 2.7 3.4 6.9 3.4s6.7-1.5 6.9-3.4H5.1z"
                            />
                        </svg>
                    </span>
                    <span class="download-text">
                        <span class="download-title">Download on Android</span>
                        <span class="download-meta">{androidMetaLabel}</span>
                    </span>
                </a>

                <button type="button" class="download-btn" onclick={handleIosClick}>
                    <span class="download-logo" aria-hidden="true">
                        <svg viewBox="0 0 24 24" width="28" height="28" focusable="false">
                            <path
                                fill="currentColor"
                                d="M16.7 12.6c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.1.8-.7 0-1.7-.7-2.8-.7-1.4 0-2.8.9-3.5 2.2-1.5 2.6-.4 6.4 1.1 8.5.7 1 1.6 2.1 2.7 2.1 1.1 0 1.5-.7 2.8-.7s1.7.7 2.8.7c1.2 0 1.9-1 2.6-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.1-.8-2.1-3.7zM14.6 6.5c.6-.7 1-1.7.9-2.7-0.9.1-1.9.6-2.5 1.3-.6.6-1.1 1.6-1 2.6 1 .1 1.9-.5 2.6-1.2z"
                            />
                        </svg>
                    </span>
                    <span class="download-text">
                        <span class="download-title">Download on iOS</span>
                        <span class="download-meta">Add to Home Screen</span>
                    </span>
                </button>
            </div>

            <template if:true={iosHint}>
                <p class="ios-hint">{iosHint}</p>
            </template>
        </section>
    </template>
</template>
