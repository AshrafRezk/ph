<template>
    <section class="panel-section">
        <div class="panel-header">
            <h3 class="panel-title">Samples</h3>
            <lightning-button label="Add Sample Row" icon-name="utility:add" onclick={handleAddRow} disabled={disabled}></lightning-button>
        </div>

        <template for:each={displaySamples} for:item="row" for:index="index">
            <article key={row.key} class="sample-card">
                <template if:true={row.productName}>
                    <div class="sample-product-header">
                        <c-product-thumbnail
                            image-url={row.imageUrl}
                            product-name={row.productName}
                            size="sm"
                        ></c-product-thumbnail>
                        <span class="sample-product-name">{row.productName}</span>
                    </div>
                </template>
                <lightning-combobox
                    label="Sample Inventory"
                    value={row.sampleInventoryId}
                    options={inventoryOptions}
                    data-index={index}
                    data-field="sampleInventoryId"
                    onchange={handleFieldChange}
                    disabled={disabled}
                    placeholder="Select product and lot"
                ></lightning-combobox>
                <div class="sample-grid">
                    <lightning-input
                        type="number"
                        label="Quantity"
                        value={row.quantity}
                        data-index={index}
                        data-field="quantity"
                        onchange={handleFieldChange}
                        disabled={disabled}
                        min="1"
                    ></lightning-input>
                    <lightning-combobox
                        label="Recipient"
                        value={row.visitAttendeeId}
                        options={attendeeOptions}
                        data-index={index}
                        data-field="visitAttendeeId"
                        onchange={handleFieldChange}
                        disabled={disabled}
                        placeholder="Optional attendee"
                    ></lightning-combobox>
                </div>
                <template if:true={row.lotNumber}>
                    <p class="sample-meta">Lot {row.lotNumber} · On hand: {row.inventoryOnHand}</p>
                </template>
                <lightning-button
                    label="Remove"
                    data-index={index}
                    onclick={handleRemoveRow}
                    disabled={disabled}
                ></lightning-button>
            </article>
        </template>

        <template if:false={displaySamples.length}>
            <p class="empty-hint">Add sample lines when distributing product samples on this call.</p>
        </template>
    </section>
</template>
