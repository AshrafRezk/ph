<template>
    <section class="queue-card">
        <header class="queue-header">
            <h2 class="queue-title">TOTs pending approval</h2>
            <p class="queue-subtitle">
                Approve or reject submitted TOT from your direct reports. Closure also syncs from Mendix when managers approve there.
            </p>
        </header>
        <template if:true={hasRows}>
            <template for:each={rows} for:item="row">
                <article key={row.requestId} class="queue-row">
                    <div class="queue-row-main">
                        <p class="queue-row-title">{row.requestName} · {row.typeLabel}</p>
                        <p class="queue-row-meta">
                            {row.repName} · {row.spanType} · {row.startLabel}
                        </p>
                        <p class="queue-row-meta">{row.mendixHint}</p>
                    </div>
                    <div class="queue-row-actions">
                        <lightning-textarea
                            label="Rejection reason"
                            variant="label-hidden"
                            placeholder="Required to reject"
                            data-request-id={row.requestId}
                            onchange={handleRejectionChange}
                        ></lightning-textarea>
                        <div class="queue-buttons">
                            <lightning-button
                                label="Approve"
                                variant="brand"
                                data-request-id={row.requestId}
                                onclick={handleApprove}
                            ></lightning-button>
                            <lightning-button
                                label="Reject"
                                variant="destructive"
                                data-request-id={row.requestId}
                                onclick={handleReject}
                            ></lightning-button>
                        </div>
                    </div>
                </article>
            </template>
        </template>
        <template if:false={hasRows}>
            <p class="queue-empty">No submitted time off requests right now.</p>
        </template>
    </section>
</template>
