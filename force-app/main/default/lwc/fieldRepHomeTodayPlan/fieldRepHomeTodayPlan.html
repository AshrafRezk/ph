<template>
    <template if:true={featureEnabled}>
    <article class="today-plan-card">
        <header class="today-plan-header">
            <div class="today-plan-heading">
                <h2 class="today-plan-title">Today’s Plan</h2>
                <p class="today-plan-subtitle">{planSubtitle}</p>
                <template if:true={canSwitchView}>
                    <div class="today-plan-rep-picker" onkeydown={handleViewerMenuKeydown}>
                        <button
                            type="button"
                            class={viewerMenuTriggerClass}
                            aria-haspopup="listbox"
                            aria-expanded={viewerMenuExpanded}
                            aria-label="View plan for"
                            onclick={handleToggleViewerMenu}
                        >
                            <span class="today-plan-viewer-label">{selectedViewerLabel}</span>
                            <template if:true={hasViewerPendingTotal}>
                                <span class="today-plan-pending" title={viewerPendingTotalTitle}>{viewerPendingTotalLabel}</span>
                            </template>
                            <span class="today-plan-viewer-caret" aria-hidden="true"></span>
                        </button>
                        <template if:true={showViewerMenu}>
                            <ul class="today-plan-viewer-menu" role="listbox" aria-label="View plan for">
                                <template for:each={viewerMenuItems} for:item="item">
                                    <li
                                        key={item.key}
                                        class={item.className}
                                        role="option"
                                        tabindex="0"
                                        aria-selected={item.ariaSelected}
                                        data-value={item.value}
                                        data-territory-id={item.territoryId}
                                        onclick={handleViewerMenuSelect}
                                        onkeydown={handleViewerOptionKeydown}
                                    >
                                        <span class="today-plan-viewer-option-label">{item.label}</span>
                                        <template if:true={item.hasPending}>
                                            <span class="today-plan-pending" title={item.pendingTitle}>{item.pendingLabel}</span>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </div>
                </template>
                <template if:true={viewingOtherBanner}>
                    <div class="viewing-other-banner">{viewingOtherBanner}</div>
                </template>
            </div>
            <div class="today-plan-header-actions">
                <lightning-button
                    label="Navigate on Google"
                    title={googleNavigateTitle}
                    variant="neutral"
                    icon-name="utility:location"
                    onclick={handleNavigateGoogle}
                    disabled={isGoogleNavigateDisabled}
                ></lightning-button>
                <lightning-button
                    label="Open Planner"
                    variant="neutral"
                    onclick={handleOpenPlanner}
                ></lightning-button>
            </div>
        </header>

        <template if:true={isLoading}>
            <div class="today-plan-loading">
                <lightning-spinner alternative-text="Loading today plan" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="today-plan-body">
                <div class="plan-layout">
                    <div class="visit-list-col">
                        <div class="sidebar-section-title">Route stops</div>
                        <template if:true={showUnlinkedNote}>
                            <div class="unlinked-note">{unlinkedNote}</div>
                        </template>

                        <template if:true={hasRouteOutliers}>
                            <div class="route-outlier-card">
                                <div class="sidebar-section-title">Distant stops</div>
                                <p class="route-outlier-summary">{distantStopsSummary}</p>
                                <ul class="route-outlier-list">
                                    <template for:each={decoratedRouteOutliers} for:item="outlier">
                                        <li key={outlier.visitId} class="route-outlier-item">
                                            <div>
                                                <strong>{outlier.accountName}</strong> — {outlier.awayLabel}
                                            </div>
                                            <template if:true={outlier.canAct}>
                                                <div class="route-stop-actions" role="group" aria-label="Distant stop actions">
                                                    <button
                                                        type="button"
                                                        class="route-stop-btn"
                                                        data-visit-id={outlier.visitId}
                                                        onclick={handlePostponeVisit}
                                                        disabled={isMutatingVisit}
                                                        title="Postpone this visit"
                                                        aria-label="Postpone visit"
                                                    >
                                                        Postpone
                                                    </button>
                                                    <button
                                                        type="button"
                                                        class="route-stop-btn route-stop-btn-danger"
                                                        data-visit-id={outlier.visitId}
                                                        onclick={handleRemoveVisit}
                                                        disabled={isMutatingVisit}
                                                        title="Remove this visit from today’s plan"
                                                        aria-label="Remove visit"
                                                    >
                                                        Remove
                                                    </button>
                                                </div>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>

                        <div class="visit-list">
                            <template for:each={upNextVisits} for:item="v">
                                <div
                                    key={v.id}
                                    class={v.stopClass}
                                    data-visit-id={v.id}
                                    onclick={handleSelectVisit}
                                    role="button"
                                    tabindex="0"
                                >
                                    <span class={v.orderClass}>{v.orderLabel}</span>
                                    <div class="route-stop-body">
                                        <template if:true={v.typeIconUrl}>
                                            <img class="visit-type-icon" src={v.typeIconUrl} alt="" />
                                        </template>
                                        <button
                                            type="button"
                                            class="account-name-link"
                                            data-account-id={v.accountId}
                                            onclick={handleOpenAccount}
                                        >
                                            {v.accountName}
                                        </button>
                                        <div class="route-stop-type">{v.accountTypeLabel}</div>
                                        <template if:true={v.accountSpecialty}>
                                            <div class="route-stop-specialty">{v.accountSpecialty}</div>
                                        </template>
                                        <div class="route-stop-time">{v.timeLabel}</div>
                                        <div class="route-stop-meta">
                                            <span class={v.statusClass}>{v.statusLabel}</span>
                                            <template if:true={v.isOutlier}>
                                                <span class="outlier-badge" title="Far from other stops">Route outlier</span>
                                            </template>
                                            <template if:false={v.hasLocation}>
                                                <span class="geo-warning">No geocode</span>
                                            </template>
                                        </div>
                                        <div class="route-stop-actions">
                                            <button
                                                type="button"
                                                class="route-stop-btn"
                                                data-visit-id={v.id}
                                                onclick={handleOpenVisit}
                                            >
                                                View call
                                            </button>
                                            <template if:true={v.canMutate}>
                                                <button
                                                    type="button"
                                                    class="route-stop-btn"
                                                    data-visit-id={v.id}
                                                    onclick={handlePostponeVisit}
                                                    disabled={isMutatingVisit}
                                                >
                                                    Postpone
                                                </button>
                                                <button
                                                    type="button"
                                                    class="route-stop-btn route-stop-btn-danger"
                                                    data-visit-id={v.id}
                                                    onclick={handleRemoveVisit}
                                                    disabled={isMutatingVisit}
                                                >
                                                    Remove
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </div>
                            </template>

                            <template if:true={hasNoVisits}>
                                <div class="empty-state">
                                    No account visits scheduled for today.
                                    <button type="button" class="empty-link" onclick={handleOpenPlanner}>
                                        Plan your day in Planner
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="map-col">
                        <div class="map-wrapper">
                            <div class="map-container" lwc:dom="manual"></div>
                        </div>

                        <div class="map-legend">
                            <span class="legend-item"><span class="legend-pin legend-pin-hcp"></span>HCP</span>
                            <span class="legend-item"><span class="legend-pin legend-pin-hco"></span>HCO</span>
                            <span class="legend-item"><span class="legend-pin legend-pin-pharmacy"></span>Pharmacy</span>
                            <template if:true={isViewingSelf}>
                                <span class="legend-item"><span class="legend-pin legend-pin-you"></span>You</span>
                            </template>
                        </div>

                        <template if:true={routeSummary}>
                            <div class="route-summary">
                                <span class="route-summary-label">Route estimate</span>
                                <span class="route-summary-value">
                                    {routeSummary.distanceKm} km · {routeSummary.durationMin} min drive
                                </span>
                            </div>
                        </template>
                    </div>
                </div>

                <template if:true={hasOptimizationIdeas}>
                    <div class="ideas-panel">
                        <div class="sidebar-section-title">Optimization ideas</div>
                        <ul class="ideas-list">
                            <template for:each={optimizationIdeas} for:item="idea">
                                <li key={idea.id} class={idea.itemClass}>
                                    <lightning-icon
                                        icon-name={idea.iconName}
                                        size="x-small"
                                        class={idea.iconClass}
                                        alternative-text="Tip"
                                    ></lightning-icon>
                                    <div class="ideas-content">
                                        <span class="ideas-text">{idea.text}</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </template>

        <template if:true={showPostponeModal}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                class="slds-modal slds-fade-in-open postpone-modal"
                onclick={handleClosePostponeModal}
            >
                <div class="slds-modal__container" onclick={handlePostponeModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Postpone visit</h2>
                        <button
                            type="button"
                            class="slds-button slds-button_icon slds-modal__close"
                            onclick={handleClosePostponeModal}
                            title="Close"
                        >
                            <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                        </button>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="postpone-modal-copy">Choose a new date and time for {postponeAccountLabel}.</p>
                        <lightning-input
                            type="datetime"
                            label="New start date &amp; time"
                            value={postponeDateTime}
                            onchange={handlePostponeDateTimeChange}
                            required
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            variant="neutral"
                            onclick={handleClosePostponeModal}
                            disabled={isMutatingVisit}
                        ></lightning-button>
                        <lightning-button
                            label="Postpone"
                            variant="brand"
                            onclick={handleConfirmPostpone}
                            disabled={isMutatingVisit}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </article>
    </template>
</template>
