<template>
    <section role={sectionRole} tabindex="-1" class={shellClass}>
        <div class={containerClass}>
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Record Request</h2>
                <p class="slds-text-body_small slds-m-top_x-small inquiry-subtitle">
                    Capture a request during this visit. It can be a medical request or another request, and is sent to the Medical Team, the Service Team, or the manager.
                </p>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading service request form" size="medium"></lightning-spinner>
                </template>

                <template if:false={isLoading}>
                    <template if:true={errorMessage}>
                        <p class="inquiry-error">{errorMessage}</p>
                    </template>

                    <template if:false={errorMessage}>
                        <div class="inquiry-meta-grid">
                            <div class="meta-item">
                                <span class="meta-label">Visit</span>
                                <span class="meta-value">{visitName}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Account</span>
                                <span class="meta-value">{accountName}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Field Rep</span>
                                <span class="meta-value">{assignedToName}</span>
                            </div>
                        </div>

                        <template if:true={isLocked}>
                            <div class="locked-note slds-m-top_medium">
                                This visit is completed or cancelled. Existing service requests are shown below in read-only mode.
                            </div>
                        </template>

                        <template if:true={showIntakeForm}>
                            <lightning-combobox
                                class="slds-m-top_medium"
                                label="Request Type"
                                value={selectedRequestType}
                                options={requestTypeOptions}
                                onchange={handleRequestTypeChange}
                                placeholder="Select request type"
                                required
                            ></lightning-combobox>
                            <lightning-combobox
                                class="slds-m-top_small"
                                label="Inquirer"
                                value={selectedInquirerId}
                                options={inquirerOptions}
                                onchange={handleInquirerChange}
                                placeholder="Select inquirer"
                                required
                            ></lightning-combobox>
                            <lightning-combobox
                                class="slds-m-top_small"
                                label="Product"
                                value={selectedProductId}
                                options={productOptions}
                                onchange={handleProductChange}
                                placeholder="Select product"
                                required
                            ></lightning-combobox>
                            <lightning-combobox
                                class="slds-m-top_small"
                                label="Service Category"
                                value={selectedCategory}
                                options={categoryOptions}
                                onchange={handleCategoryChange}
                                placeholder="Select category"
                                required
                            ></lightning-combobox>
                            <lightning-combobox
                                class="slds-m-top_small"
                                label="Send to"
                                value={selectedRoute}
                                options={routeOptions}
                                onchange={handleRouteChange}
                                placeholder="Select destination"
                                required
                            ></lightning-combobox>
                            <lightning-textarea
                                class="slds-m-top_small"
                                label="Request Details"
                                value={questionText}
                                onchange={handleQuestionChange}
                                placeholder="Describe the service request"
                                required
                            ></lightning-textarea>
                        </template>

                        <template if:true={hasExistingInquiries}>
                            <div class="inquiry-list-wrap slds-m-top_medium">
                                <h3 class="inquiry-list-title">Requests on this visit</h3>
                                <ul class="inquiry-list">
                                    <template for:each={existingInquiries} for:item="inquiry">
                                        <li key={inquiry.caseId} class="inquiry-list-item">
                                            <button
                                                type="button"
                                                class="inquiry-link"
                                                data-case-id={inquiry.caseId}
                                                onclick={handleOpenCase}
                                            >
                                                {inquiry.caseNumber}
                                            </button>
                                            <span class="inquiry-meta">
                                                {inquiry.productName} · {inquiry.questionCategory} · {inquiry.status}
                                                <template if:true={inquiry.routedTo}> · {inquiry.routedTo}</template>
                                            </span>
                                            <span class="inquiry-date">{inquiry.createdLabel}</span>
                                            <template if:true={inquiry.hasResponse}>
                                                <span class="inquiry-response slds-col slds-size_1-of-1">
                                                    <span class="inquiry-response-label">
                                                        Response {inquiry.responseDateLabel}
                                                    </span>
                                                    <span class="inquiry-response-text">{inquiry.responsePreview}</span>
                                                </span>
                                            </template>
                                        </li>
                                    </template>
                                </ul>
                            </div>
                        </template>
                    </template>
                </template>
            </div>

            <footer class="slds-modal__footer">
                <template if:false={embedded}>
                    <lightning-button label="Close" onclick={handleClose}></lightning-button>
                </template>
                <template if:true={showIntakeForm}>
                    <lightning-button
                        class="slds-m-left_x-small"
                        label="Submit Request"
                        variant="brand"
                        onclick={handleSubmit}
                        disabled={submitDisabled}
                    ></lightning-button>
                </template>
            </footer>
        </div>
    </section>
    <template if:false={embedded}>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
