<template>
    <section class="product-territory-manager">
        <header class="manager-header">
            <p class="manager-subtitle">
                Select a product on the left, then align it to territories on the right.
                Check a parent territory to include all child territories when cascade is enabled.
            </p>
        </header>

        <div class="manager-panels">
            <section class="panel panel-products">
                <div class="panel-heading">
                    <div class="panel-heading-row">
                        <h3>Product Catalog</h3>
                        <lightning-button
                            label="New product"
                            variant="brand-outline"
                            icon-name="utility:add"
                            onclick={handleNewProduct}
                        ></lightning-button>
                    </div>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        label="Search products"
                        placeholder="Search name, code, external id..."
                        value={productSearchTerm}
                        onchange={handleProductSearch}
                    ></lightning-input>
                </div>

                <template if:true={hasProducts}>
                    <ul class="tree-list" role="tree" aria-label="Product catalog">
                        <template for:each={productFlatRows} for:item="row">
                            <li key={row.rowKey} class={row.rowClass} role="treeitem">
                                <div class="tree-row-content" style={row.depthStyle}>
                                    <template if:true={row.hasChildren}>
                                        <button
                                            class="toggle-btn"
                                            data-key={row.key}
                                            onclick={handleProductToggle}
                                            title="Expand or collapse"
                                        >
                                            <lightning-icon
                                                icon-name={row.chevronIcon}
                                                size="x-small"
                                            ></lightning-icon>
                                        </button>
                                    </template>
                                    <template if:false={row.hasChildren}>
                                        <span class="toggle-spacer"></span>
                                    </template>

                                    <template if:true={row.productId}>
                                        <button
                                            class="product-select-btn"
                                            data-id={row.productId}
                                            data-label={row.label}
                                            onclick={handleProductSelect}
                                        >
                                            <c-product-thumbnail
                                                image-url={row.imageUrl}
                                                product-name={row.label}
                                                size="sm"
                                            ></c-product-thumbnail>
                                            <span class="product-text">
                                                <span class="product-name">{row.label}</span>
                                                <span class="product-meta">{row.metaLine}</span>
                                            </span>
                                        </button>
                                        <template if:true={row.isSelected}>
                                            <lightning-button-icon
                                                class="view-product-row-btn"
                                                icon-name="utility:new_window"
                                                alternative-text="View Product"
                                                title="View Product"
                                                variant="border-filled"
                                                size="x-small"
                                                onclick={handleViewProduct}
                                            ></lightning-button-icon>
                                        </template>
                                    </template>
                                </div>
                            </li>
                        </template>
                    </ul>
                </template>

                <template if:false={hasProducts}>
                    <div class="empty-state">
                        <template if:true={hasProductSearch}>
                            <p>No products match “{productSearchTerm}”. Try part of the name or the product code.</p>
                        </template>
                        <template if:false={hasProductSearch}>
                            <p>No Pharma products found. Run the product catalog seed first.</p>
                        </template>
                    </div>
                </template>
            </section>

            <section class="panel panel-territories">
                <div class="panel-heading">
                    <div class="panel-heading-row">
                        <h3>{territoryPaneTitle}</h3>
                        <lightning-button
                            class="view-product-btn"
                            label="Edit product"
                            variant="neutral"
                            icon-name="utility:edit"
                            onclick={handleEditProduct}
                            disabled={isViewProductDisabled}
                            title="Change the selected product's details"
                        ></lightning-button>
                        <lightning-button
                            class="view-product-btn"
                            label="View Product"
                            variant="neutral"
                            icon-name="utility:new_window"
                            onclick={handleViewProduct}
                            disabled={isViewProductDisabled}
                            title="Open the selected product record"
                        ></lightning-button>
                    </div>
                    <lightning-input
                        type="search"
                        variant="label-hidden"
                        label="Search territories"
                        placeholder="Search territories..."
                        value={territorySearchTerm}
                        onchange={handleTerritorySearch}
                        disabled={isLoadingTerritories}
                    ></lightning-input>
                </div>

                <template if:true={showTerritoryPane}>
                    <div class="territory-toolbar">
                        <lightning-input
                            type="toggle"
                            label="Cascade to child territories"
                            checked={cascadeToChildren}
                            onchange={handleCascadeToggle}
                            message-toggle-active="On"
                            message-toggle-inactive="Off"
                        ></lightning-input>
                        <span class="alignment-count">{selectedAlignmentCount} selected</span>
                    </div>

                    <template if:true={isLoadingTerritories}>
                        <div class="loading-state">
                            <lightning-spinner alternative-text="Loading territories" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isLoadingTerritories}>
                        <template if:true={hasTerritories}>
                            <ul class="tree-list" role="tree" aria-label="Territory hierarchy">
                                <template for:each={territoryFlatRows} for:item="row">
                                    <li key={row.key} class="tree-row" role="treeitem">
                                        <div class="tree-row-content" style={row.depthStyle}>
                                            <template if:true={row.hasChildren}>
                                                <button
                                                    class="toggle-btn"
                                                    data-id={row.id}
                                                    onclick={handleTerritoryExpand}
                                                    title="Expand or collapse"
                                                >
                                                    <lightning-icon
                                                        icon-name={row.chevronIcon}
                                                        size="x-small"
                                                    ></lightning-icon>
                                                </button>
                                            </template>
                                            <template if:false={row.hasChildren}>
                                                <span class="toggle-spacer"></span>
                                            </template>
                                            <lightning-input
                                                type="checkbox"
                                                label={row.checkboxLabel}
                                                checked={row.checked}
                                                data-id={row.id}
                                                onchange={handleTerritoryCheck}
                                                variant="label-hidden"
                                            ></lightning-input>
                                            <span class="territory-name">{row.name}</span>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </template>

                        <template if:false={hasTerritories}>
                            <div class="empty-state">
                                <template if:true={hasTerritorySearch}>
                                    <p>No territories match “{territorySearchTerm}”.</p>
                                </template>
                                <template if:false={hasTerritorySearch}>
                                    <p>No territories found. Run territory seeding to populate the hierarchy.</p>
                                </template>
                            </div>
                        </template>
                    </template>
                </template>

                <template if:false={showTerritoryPane}>
                    <div class="empty-state">
                        <p>Select a product to view and edit territory alignment.</p>
                    </div>
                </template>
            </section>
        </div>

        <template if:true={showEditor}>
            <section class="slds-modal slds-fade-in-open" role="dialog" aria-modal="true" aria-labelledby="product-editor-title">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 id="product-editor-title" class="slds-modal__title">{editorTitle}</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <template if:true={isEditorLoading}>
                            <lightning-spinner alternative-text="Loading product" size="small"></lightning-spinner>
                        </template>
                        <template if:false={isEditorLoading}>
                            <p class="editor-help">
                                Brand → Detail (the item you promote and sell) → Sample or Brand Reminder.
                                The product code can't change after saving, because sales imports match on it.
                            </p>
                            <div class="editor-grid">
                                <lightning-combobox
                                    label="Product type"
                                    required
                                    options={productTypeOptions}
                                    value={draft.productType}
                                    data-field="productType"
                                    onchange={handleDraftChange}
                                ></lightning-combobox>
                                <lightning-input
                                    label="Product name"
                                    required
                                    value={draft.name}
                                    data-field="name"
                                    onchange={handleDraftChange}
                                ></lightning-input>
                                <template if:true={needsParent}>
                                    <lightning-combobox
                                        class="editor-wide"
                                        label={parentLabel}
                                        required
                                        options={parentOptions}
                                        value={draft.parentId}
                                        placeholder="Choose…"
                                        data-field="parentId"
                                        onchange={handleDraftChange}
                                    ></lightning-combobox>
                                </template>
                                <lightning-input
                                    label="Product code"
                                    required
                                    value={draft.productCode}
                                    disabled={isEditing}
                                    field-level-help="Used by sales imports and distributor mapping. Fixed after saving."
                                    data-field="productCode"
                                    onchange={handleDraftChange}
                                ></lightning-input>
                                <lightning-input
                                    label="External ID"
                                    value={draft.externalId}
                                    disabled={isEditing}
                                    placeholder="Same as product code"
                                    field-level-help="Leave blank to use the product code. Fixed after saving."
                                    data-field="externalId"
                                    onchange={handleDraftChange}
                                ></lightning-input>
                                <lightning-combobox
                                    label="Sales line"
                                    options={salesLineOptions}
                                    value={draft.salesLine}
                                    placeholder="None"
                                    data-field="salesLine"
                                    onchange={handleDraftChange}
                                ></lightning-combobox>
                                <lightning-input
                                    label="Therapy area"
                                    value={draft.therapyArea}
                                    data-field="therapyArea"
                                    onchange={handleDraftChange}
                                ></lightning-input>
                                <template if:true={showPackFields}>
                                    <lightning-input
                                        label="Strength"
                                        placeholder="e.g. 20 MG"
                                        value={draft.strength}
                                        data-field="strength"
                                        onchange={handleDraftChange}
                                    ></lightning-input>
                                    <lightning-input
                                        label="Form"
                                        placeholder="e.g. Tablet, Syrup"
                                        value={draft.form}
                                        data-field="form"
                                        onchange={handleDraftChange}
                                    ></lightning-input>
                                    <lightning-input
                                        label="Sales unit"
                                        placeholder="e.g. GIT, CLUSTER"
                                        value={draft.salesUnit}
                                        data-field="salesUnit"
                                        onchange={handleDraftChange}
                                    ></lightning-input>
                                    <lightning-input
                                        type="number"
                                        label="Box quantity"
                                        min="0"
                                        value={draft.boxQuantity}
                                        data-field="boxQuantity"
                                        onchange={handleDraftChange}
                                    ></lightning-input>
                                    <lightning-input
                                        type="number"
                                        label="Public price (EGP)"
                                        min="0"
                                        step="0.01"
                                        value={draft.publicPrice}
                                        field-level-help="Saved in the standard price book. Sales policy uses it for non-tender value."
                                        data-field="publicPrice"
                                        onchange={handleDraftChange}
                                    ></lightning-input>
                                </template>
                                <template if:true={isReminder}>
                                    <lightning-combobox
                                        label="Reminder kind"
                                        options={reminderKindOptions}
                                        value={draft.reminderKind}
                                        data-field="reminderKind"
                                        onchange={handleDraftChange}
                                    ></lightning-combobox>
                                </template>
                                <lightning-input
                                    class="editor-wide"
                                    type="url"
                                    label="Image URL"
                                    value={draft.imageUrl}
                                    data-field="imageUrl"
                                    onchange={handleDraftChange}
                                ></lightning-input>
                                <lightning-textarea
                                    class="editor-wide"
                                    label="Description"
                                    value={draft.description}
                                    data-field="description"
                                    onchange={handleDraftChange}
                                ></lightning-textarea>
                                <lightning-input
                                    type="checkbox"
                                    label="Show in HCP app"
                                    checked={draft.showInHcpApp}
                                    data-field="showInHcpApp"
                                    onchange={handleDraftChange}
                                ></lightning-input>
                                <lightning-input
                                    type="checkbox"
                                    label="Active"
                                    checked={draft.isActive}
                                    field-level-help="Inactive products disappear from visits and orders, and show greyed as Inactive in this catalog. History stays."
                                    data-field="isActive"
                                    onchange={handleDraftChange}
                                ></lightning-input>
                            </div>
                        </template>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleCloseEditor}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="Save product"
                            variant="brand"
                            disabled={isEditorSaveDisabled}
                            onclick={handleSaveProduct}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <footer class="manager-footer">
            <lightning-button
                label="Save Alignment"
                variant="brand"
                onclick={handleSave}
                disabled={isSaveDisabled}
            ></lightning-button>
        </footer>
    </section>
</template>
