<template>
    <section class="clm-presentations-hub">
        <template if:true={redirectToOffline}>
            <aside class="offline-redirect-banner" role="status">
                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                <div class="offline-redirect-copy">
                    <strong>CLM plays in the Offline Field app</strong>
                    <p>
                        Open presentations from
                        <a href={offlineAppUrl} target="_blank" rel="noopener noreferrer"
                            >salesforceoffline.com</a
                        >
                        (Field Co-pilot → CLM Presentations). Lightning does not play decks here.
                    </p>
                </div>
                <lightning-button
                    label="Open Offline App"
                    variant="brand"
                    onclick={handleOpenOfflineApp}
                ></lightning-button>
            </aside>
        </template>
        <header class="hub-header">
            <lightning-icon icon-name="utility:screen" size="small"></lightning-icon>
            <div>
                <h1>CLM Presentations</h1>
                <p>Select a presentation to present immediately.</p>
            </div>
            <div class="hub-header-actions">
                <lightning-button
                    label="Save all offline"
                    icon-name="utility:download"
                    onclick={handleSaveAllOffline}
                    disabled={isSaving}
                ></lightning-button>
                <lightning-button
                    label="Refresh"
                    icon-name="utility:refresh"
                    onclick={loadPresentations}
                    disabled={isLoading}
                ></lightning-button>
            </div>
        </header>

        <template if:true={isSaving}>
            <p class="save-progress">{saveLabel}</p>
        </template>

        <template if:true={showPlayer}>
            <c-clm-player
                ad-hoc
                presentation-id={activePresentationId}
                presentation-name={activePresentationName}
                onclose={handlePlayerClose}
                onswitchpresentation={handleSwitchPresentation}
            ></c-clm-player>
        </template>

        <template if:false={showPlayer}>
            <article class="panel">
                <h2 class="panel-title">Available Presentations</h2>
                <template if:true={offlineHint}>
                    <p class="offline-hint">{offlineHint}</p>
                </template>
                <template if:true={hasPresentations}>
                    <div class="card-grid">
                        <template for:each={presentationCards} for:item="pres">
                            <article key={pres.key} class="pres-card">
                                <h3>{pres.name}</h3>
                                <p class="meta">{pres.formatType} · {pres.slideCountLabel}</p>
                                <p class="meta product-meta-row">
                                    <c-product-thumbnail
                                        image-url={pres.imageUrl}
                                        product-name={pres.productName}
                                        size="sm"
                                    ></c-product-thumbnail>
                                    <span>Product: {pres.productName}</span>
                                </p>
                                <lightning-button
                                    label={presentButtonLabel}
                                    variant="brand"
                                    data-id={pres.id}
                                    data-name={pres.name}
                                    onclick={handlePresent}
                                ></lightning-button>
                            </article>
                        </template>
                    </div>
                </template>
                <template if:false={hasPresentations}>
                    <p class="empty">
                        No presentations are available.
                    </p>
                </template>
            </article>
        </template>
    </section>
</template>
