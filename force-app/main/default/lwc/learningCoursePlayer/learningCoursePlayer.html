<template>
    <div class="course-player">
        <div class="player-header">
            <div class="header-left">
                <button
                    class="back-btn"
                    type="button"
                    title="Back to My Learning"
                    aria-label="Back to My Learning"
                    onclick={handleBack}
                >
                    <span class="back-chevron" aria-hidden="true"></span>
                </button>
                <div class="header-copy">
                    <div class="course-title">{player.title}</div>
                    <div class="status-chip">{player.status}</div>
                </div>
            </div>
            <div class="header-progress">
                <div class="progress-track" aria-hidden="true">
                    <div class="progress-fill" style={progressStyle}></div>
                </div>
                <span class="progress-pct">{progressLabel}</span>
                <template if:true={showCertificateCta}>
                    <lightning-button
                        class="slds-m-left_small"
                        label="View Certificate"
                        variant="brand"
                        onclick={handleShowCertificate}
                    ></lightning-button>
                </template>
            </div>
        </div>

        <div class="player-body">
            <div class="curriculum" aria-label="Course curriculum">
                <div class="curriculum-header">
                    <div class="curriculum-heading">Curriculum</div>
                    <span class="curriculum-count">{curriculumCountLabel}</span>
                </div>
                <template if:true={hasCurriculum}>
                    <ul class="curriculum-list">
                        <template for:each={curriculum} for:item="item">
                            <li key={item.rowKey}>
                                <button
                                    class={item.itemClass}
                                    data-id={item.instanceId}
                                    onclick={handleSelectLesson}
                                    type="button"
                                    disabled={item.isDisabled}
                                >
                                    <span class="item-icon-wrap">
                                        <lightning-icon
                                            icon-name={item.iconName}
                                            size="x-small"
                                        ></lightning-icon>
                                    </span>
                                    <span class="lesson-copy">
                                        <span class="lesson-type">{item.typeLabel}</span>
                                        <span class="lesson-title">{item.title}</span>
                                        <span class="lesson-meta">{item.metaLabel}</span>
                                    </span>
                                    <template if:true={item.isLocked}>
                                        <lightning-icon
                                            class="lock-icon"
                                            icon-name="utility:lock"
                                            size="x-small"
                                        ></lightning-icon>
                                    </template>
                                    <template if:true={item.completed}>
                                        <lightning-icon
                                            class="complete-icon"
                                            icon-name="utility:success"
                                            size="x-small"
                                        ></lightning-icon>
                                    </template>
                                </button>
                            </li>
                        </template>
                    </ul>
                </template>
                <template if:false={hasCurriculum}>
                    <p class="curriculum-empty">
                        No learning materials in this course yet. Ask your learning manager to add child materials.
                    </p>
                </template>
            </div>

            <div class="stage">
                <template if:true={selectedItem}>
                    <div class="stage-title">{selectedItem.title}</div>

                    <template if:true={isContent}>
                        <template for:each={contentStageItems} for:item="stageItem">
                            <c-learning-content-viewer
                                key={stageItem.key}
                                material-type={stageItem.materialType}
                                material-url={stageItem.materialUrl}
                                description={stageItem.description}
                                title={stageItem.title}
                                initial-watch-percent={stageItem.initialWatchPercent}
                                onwatchprogress={handleWatchProgress}
                            ></c-learning-content-viewer>
                        </template>
                    </template>

                    <template if:true={isQuiz}>
                        <template for:each={quizStageItems} for:item="stageItem">
                            <c-quiz-player
                                key={stageItem.key}
                                instance-id={stageItem.instanceId}
                                onquizcomplete={handleQuizComplete}
                            ></c-quiz-player>
                        </template>
                    </template>
                </template>
                <template if:false={selectedItem}>
                    <p class="stage-empty">Select a lesson from the curriculum to begin.</p>
                </template>
            </div>
        </div>

        <template if:true={selectedItem}>
            <div class="player-footer">
                <lightning-button
                    label="Previous"
                    disabled={previousDisabled}
                    onclick={goPrevious}
                ></lightning-button>
                <div class="player-footer-right">
                    <template if:true={navHint}>
                        <span class="nav-hint">{navHint}</span>
                    </template>
                    <template if:true={canMarkComplete}>
                        <lightning-button
                            class="slds-m-right_small"
                            variant="brand"
                            label="Mark complete"
                            disabled={busy}
                            onclick={handleMarkComplete}
                        ></lightning-button>
                    </template>
                    <lightning-button
                        variant="brand"
                        label="Next"
                        title={navHint}
                        disabled={nextDisabled}
                        onclick={goNext}
                    ></lightning-button>
                </div>
            </div>
        </template>
    </div>
</template>
