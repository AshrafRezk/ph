<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open coaching-modal">
        <div class="slds-modal__container coaching-modal-container">
            <header class="slds-modal__header">
                <h2 class="slds-text-heading_medium">Coach</h2>
                <p class="slds-text-body_small slds-m-top_x-small coaching-subtitle">
                    Include this visit and any other same-day visits for this rep. Scoring starts as soon as the coaching event is created, whether or not the visit is already a double visit.
                </p>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading coaching form" size="medium"></lightning-spinner>
                </template>

                <template if:false={isLoading}>
                    <template if:true={errorMessage}>
                        <p class="coaching-error">{errorMessage}</p>
                    </template>

                    <template if:true={offlineHint}>
                        <p class="slds-text-body_small slds-m-bottom_small">{offlineHint}</p>
                    </template>

                    <template if:false={errorMessage}>
                        <div class="coaching-meta-grid">
                            <div class="meta-item">
                                <span class="meta-label">Employee (Rep)</span>
                                <span class="meta-value">{employeeName}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Manager (Reviewer)</span>
                                <span class="meta-value">{managerName}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-label">Account</span>
                                <span class="meta-value">{accountName}</span>
                            </div>
                        </div>

                        <template if:false={hasCoachingEvent}>
                            <lightning-combobox
                                class="slds-m-top_medium"
                                label="Coaching Template"
                                value={selectedTemplateId}
                                options={templateOptions}
                                onchange={handleTemplateChange}
                                placeholder="Select a template"
                                required
                            ></lightning-combobox>
                            <lightning-input
                                class="slds-m-top_small"
                                type="checkbox"
                                label="Prefill from visit objective and notes"
                                checked={prefillFromVisit}
                                onchange={handlePrefillChange}
                            ></lightning-input>
                            <p class="prefill-hint">
                                Prefill seeds manager comments on the first competency using this visit&apos;s objective and notes.
                            </p>

                            <div class="visit-picker slds-m-top_medium">
                                <div class="visit-picker-header">
                                    <h3 class="slds-text-heading_small">Same-day visits</h3>
                                    <span class="visit-count-pill">{visitCountLabel}</span>
                                </div>
                                <p class="prefill-hint">
                                    Visits created by or assigned to this rep on the same calendar day. This visit stays selected.
                                </p>
                                <template if:true={hasSameDayVisits}>
                                    <lightning-input
                                        class="slds-m-top_small"
                                        type="checkbox"
                                        label="Select all available visits"
                                        checked={allSelectableSelected}
                                        onchange={handleSelectAll}
                                    ></lightning-input>
                                    <ul class="visit-list">
                                        <template for:each={visits} for:item="row">
                                            <li key={row.visitId} class="visit-card">
                                                <div class="visit-card-top">
                                                    <lightning-input
                                                        type="checkbox"
                                                        label={row.visitName}
                                                        checked={row.selected}
                                                        disabled={row.checkboxDisabled}
                                                        data-visit-id={row.visitId}
                                                        onchange={handleVisitToggle}
                                                    ></lightning-input>
                                                    <template if:true={row.isCurrent}>
                                                        <span class="current-pill">This visit</span>
                                                    </template>
                                                    <template if:true={row.alreadyOnOtherEvent}>
                                                        <span class="other-event-pill">Already coached</span>
                                                    </template>
                                                    <lightning-button
                                                        variant="base"
                                                        label="Open"
                                                        icon-name="utility:new_window"
                                                        data-visit-id={row.visitId}
                                                        onclick={handleOpenVisit}
                                                    ></lightning-button>
                                                </div>
                                                <p class="visit-card-meta">
                                                    {row.accountName} · {row.startLabel} · {row.status}
                                                </p>
                                                <template if:true={row.selected}>
                                                    <lightning-textarea
                                                        class="slds-m-top_small"
                                                        label="Manager notes"
                                                        value={row.managerNotes}
                                                        data-visit-id={row.visitId}
                                                        onchange={handleNotesChange}
                                                        placeholder="Notes for this visit in this coaching session"
                                                    ></lightning-textarea>
                                                </template>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                        </template>

                        <template if:true={hasCoachingEvent}>
                            <div class="event-status-bar slds-m-top_small">
                                <span class="status-pill">Double Visit</span>
                                <span class="status-text">Coaching event status: {coachingEventStatus}</span>
                                <template if:true={canOpenEvent}>
                                    <lightning-button
                                        class="slds-m-left_small"
                                        label="Open Coaching Event"
                                        variant="base"
                                        onclick={handleOpenCoachingEvent}
                                    ></lightning-button>
                                </template>
                            </div>
                            <template if:true={hasAssociatedVisits}>
                                <div class="associated-block slds-m-top_medium">
                                    <h3 class="slds-text-heading_small">Associated visits</h3>
                                    <ul class="visit-list">
                                        <template for:each={associatedVisits} for:item="row">
                                            <li key={row.visitId} class="visit-card">
                                                <div class="visit-card-top">
                                                    <strong>{row.visitName}</strong>
                                                    <template if:true={row.isOrigin}>
                                                        <span class="current-pill">Origin</span>
                                                    </template>
                                                    <lightning-button
                                                        variant="base"
                                                        label="Open visit"
                                                        icon-name="utility:new_window"
                                                        data-visit-id={row.visitId}
                                                        onclick={handleOpenVisit}
                                                    ></lightning-button>
                                                </div>
                                                <p class="visit-card-meta">
                                                    {row.accountName} · {row.startLabel} · {row.status}
                                                </p>
                                                <template if:true={row.managerNotes}>
                                                    <p class="notes-preview">{row.managerNotes}</p>
                                                </template>
                                            </li>
                                        </template>
                                    </ul>
                                </div>
                            </template>
                            <template if:true={canOpenEvent}>
                                <div class="evaluation-wrap slds-m-top_medium">
                                    <c-coaching-event-evaluation record-id={coachingEventId}></c-coaching-event-evaluation>
                                </div>
                            </template>
                        </template>
                    </template>
                </template>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button label="Close" onclick={handleClose}></lightning-button>
                <template if:false={hasCoachingEvent}>
                    <lightning-button
                        class="slds-m-left_x-small"
                        label="Coach"
                        variant="brand"
                        onclick={handleCreate}
                        disabled={createDisabled}
                    ></lightning-button>
                </template>
                <template if:true={showSubmitForReview}>
                    <lightning-button
                        class="slds-m-left_x-small"
                        label="Send to Manager for Review"
                        variant="brand"
                        onclick={handleSubmitForReview}
                        disabled={isSubmitting}
                    ></lightning-button>
                </template>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
