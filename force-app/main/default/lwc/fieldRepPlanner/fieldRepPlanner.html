<template>
    <div class="planner-shell">
            <div class="planner-toolbar">
                <div class="toolbar-nav">
                <template if:true={canSwitchPlannerView}>
                    <div class="planner-viewer-picker" onkeydown={handleViewerMenuKeydown}>
                        <button
                            type="button"
                            class={viewerMenuTriggerClass}
                            aria-haspopup="listbox"
                            aria-expanded={viewerMenuExpanded}
                            aria-label={viewerPickerLabel}
                            onclick={handleToggleViewerMenu}
                        >
                            <span class="planner-viewer-trigger__label">{selectedViewerLabel}</span>
                            <template if:true={hasViewerPendingTotal}>
                                <span class="planner-pending-bubble" title={viewerPendingTotalTitle}>{viewerPendingTotalLabel}</span>
                            </template>
                            <span class="planner-viewer-trigger__caret" aria-hidden="true"></span>
                        </button>
                        <template if:true={showViewerMenu}>
                            <ul class="planner-viewer-menu" role="listbox" aria-label={viewerPickerLabel}>
                                <template for:each={plannerViewerMenuItems} for:item="item">
                                    <li
                                        key={item.key}
                                        class={item.className}
                                        role="option"
                                        tabindex="0"
                                        aria-selected={item.ariaSelected}
                                        data-value={item.value}
                                        data-territory-id={item.territoryId}
                                        onclick={handleViewerMenuSelect}
                                        onkeydown={handleViewerOptionKeydown}
                                    >
                                        <span class="planner-viewer-option__label">{item.label}</span>
                                        <template if:true={item.hasPending}>
                                            <span class="planner-pending-bubble" title={item.pendingTitle}>{item.pendingLabel}</span>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                    </div>
                    <template if:true={showViewerBadge}>
                        <span class="planner-territory-badge">{viewerBadgeLabel}</span>
                    </template>
                </template>
                <lightning-button-group>
                    <lightning-button label="Today" onclick={handleToday}></lightning-button>
                    <lightning-button label="This week" onclick={handleThisWeek}></lightning-button>
                    <lightning-button label="Next week" onclick={handleJumpNextWeek}></lightning-button>
                    <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Previous week" onclick={handlePrevWeek}></lightning-button-icon>
                    <lightning-button-icon icon-name="utility:chevronright" alternative-text="Next week" onclick={handleNextWeek}></lightning-button-icon>
                </lightning-button-group>

                <div class="week-range-label">{weekLabel}</div>
                <template if:true={showMapRouteSwitch}>
                <div class="view-mode-switch" role="group" aria-label="Planner view">
                    <button
                        type="button"
                        class={calendarSwitchClass}
                        title="Calendar"
                        aria-pressed={isCalendarView}
                        aria-label="Calendar view"
                        onclick={handleShowCalendar}
                    >
                        <span class="view-mode-switch__glyph" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="16" height="16" fill="currentColor" focusable="false">
                                <path d="M18 8a2 2 0 0 1 2 2v2h12V10a2 2 0 1 1 4 0v2h2a4 4 0 0 1 4 4v24a4 4 0 0 1-4 4H14a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4h2V10a2 2 0 0 1 2-2zm20 16H14v16h24V24zM14 16v4h24v-4H14z"/>
                            </svg>
                        </span>
                        <span class="view-mode-switch__label">Calendar</span>
                    </button>
                    <button
                        type="button"
                        class={mapSwitchClass}
                        title="Map &amp; Route"
                        aria-pressed={isMapView}
                        aria-label="Map and route view"
                        onclick={handleShowMap}
                    >
                        <span class="view-mode-switch__glyph" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" width="16" height="16" fill="currentColor" focusable="false">
                                <path d="M8 12.5 20 8l12 6 12-4.5V39.5L32 44l-12-6-12 4.5V12.5zm4 3.2v22.6l8-3V12.7l-8 3zm12 20.4 8 4V18.7l-8-4v21.4zm12-17.2v22.8l8-3V15.9l-8 3z"/>
                            </svg>
                        </span>
                        <span class="view-mode-switch__label">Map</span>
                    </button>
                </div>
                </template>
                </div>

                <div class="toolbar-view-actions">
                    <template if:true={showCopyPreviousPlan}>
                    <div class="copy-plan-wrap">
                        <button
                            type="button"
                            class={copyPlanButtonClass}
                            title="Copy previous plan"
                            aria-expanded={showCopyPlanMenu}
                            aria-haspopup="menu"
                            onclick={handleToggleCopyPlanMenu}
                            disabled={isCopyPlanDisabled}
                        >
                            Copy previous plan
                        </button>
                        <template if:true={showCopyPlanMenu}>
                            <div class="copy-plan-menu" role="menu">
                                <button
                                    type="button"
                                    class="copy-plan-menu-item"
                                    role="menuitem"
                                    data-week-count="1"
                                    onclick={handleCopyPreviousPlan}
                                    disabled={isCopyingWeek}
                                >
                                    Copy 1 Week
                                </button>
                                <button
                                    type="button"
                                    class="copy-plan-menu-item"
                                    role="menuitem"
                                    data-week-count="2"
                                    onclick={handleCopyPreviousPlan}
                                    disabled={isCopyingWeek}
                                >
                                    Copy 2 Weeks
                                </button>
                            </div>
                        </template>
                    </div>
                    </template>
                    <lightning-button
                        label={submitWeekLabel}
                        variant="brand"
                        onclick={handleSubmitWeek}
                        disabled={isSubmitWeekDisabled}
                    ></lightning-button>
                    <template if:true={showPlanningPlus}>
                    <button
                        type="button"
                        class={planningPlusButtonClass}
                        title="Add meeting or time off"
                        aria-expanded={showPlanningPalettePanel}
                        aria-label="Add meeting or time off"
                        onclick={handleTogglePlanningPalette}
                        disabled={isReadOnlyPlannerView}
                    >
                        <span class="planning-plus-glyph" aria-hidden="true">＋</span>
                    </button>
                    </template>
                    <div class="planner-legend-wrap">
                        <button
                            type="button"
                            class={legendButtonClass}
                            title="Color legend"
                            aria-expanded={showLegendPanel}
                            aria-controls="planner-legend-panel"
                            aria-label="Color legend"
                            onclick={handleToggleLegend}
                        >
                            Legend
                        </button>
                        <template if:true={showLegendPanel}>
                            <div
                                id="planner-legend-panel"
                                class="planner-color-legend planner-color-legend-popover"
                                role="dialog"
                                aria-label="Planner color legend"
                                onclick={stopLegendPanelClick}
                            >
                                <span class="planner-legend-group">
                                    <span class="planner-legend-group-label">Visits</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch visit-draft"></span> Draft</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch visit-submitted"></span> Submitted</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch visit-scheduled"></span> Scheduled</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch visit-completed"></span> Completed</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch visit-cancelled"></span> Cancelled</span>
                                </span>
                                <span class="planner-legend-group">
                                    <span class="planner-legend-group-label">TOT</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch tot-draft"></span> Draft</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch tot-submitted"></span> Submitted</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch tot-scheduled"></span> Scheduled</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch tot-rejected"></span> Rejected</span>
                                </span>
                                <span class="planner-legend-group">
                                    <span class="planner-legend-group-label">Meetings</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch meeting-draft"></span> Draft</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch meeting-submitted"></span> Submitted</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch meeting-scheduled"></span> Scheduled</span>
                                    <span class="planner-legend-item"><span class="planner-legend-swatch meeting-rejected"></span> Rejected</span>
                                </span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <template if:true={canSubmitWeek}>
                <div class="planner-submit-banner">
                    <span>{draftSubmitBannerLabel}</span>
                    <button
                        type="button"
                        class="planner-submit-banner-btn"
                        onclick={handleSubmitWeek}
                        disabled={isSubmitWeekDisabled}
                    >
                        Submit for approval
                    </button>
                </div>
            </template>
            <template if:true={showTeamPlannerBanner}>
                <div class="planner-manager-banner" role="status">
                    {teamPlannerBannerLabel}
                </div>
            </template>
            <template if:true={isMapView}>
                <div class="planner-map-toolbar is-open">
                    <lightning-combobox
                        class="map-toolbar-day"
                        label="Map day"
                        variant="label-hidden"
                        value={mapDayKey}
                        options={mapDayOptions}
                        onchange={handleMapDayChange}
                    ></lightning-combobox>
                    <lightning-button
                        label={buildRouteLabel}
                        variant="brand"
                        onclick={handleBuildRoute}
                        disabled={isRouteDisabled}
                    ></lightning-button>
                    <lightning-button
                        label={optimizeRouteLabel}
                        onclick={handleOptimizeRoute}
                        disabled={isOptimizeDisabled}
                    ></lightning-button>
                    <lightning-button
                        label="Update route &amp; calendar"
                        variant="success"
                        onclick={handleUpdateRouteAndCalendar}
                        disabled={isUpdateRouteDisabled}
                    ></lightning-button>
                    <lightning-combobox
                        class="map-toolbar-day"
                        label="Copy to day"
                        variant="label-hidden"
                        placeholder="Copy to day"
                        value={copyTargetDayKey}
                        options={copyTargetDayOptions}
                        onchange={handleCopyTargetDayChange}
                        disabled={isReadOnlyPlannerView}
                    ></lightning-combobox>
                    <lightning-button
                        label="Copy day"
                        onclick={handleCopyDay}
                        disabled={isCopyDayDisabled}
                    ></lightning-button>
                </div>
            </template>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading planner" size="medium"></lightning-spinner>
            </template>

            <template if:true={errorMessage}>
                <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
            </template>

            <template if:true={viewerContextLabel}>
                <div class="planner-readonly-banner">{viewerContextLabel}</div>
            </template>

            <div class="mobile-planner-nav" role="tablist" aria-label="Mobile view sections">
                <button
                    type="button"
                    class={mobileCalendarBtnClass}
                    role="tab"
                    aria-selected={isMobileCalendarTab}
                    onclick={handleSelectMobileCalendar}
                >
                    Calendar Grid
                </button>
                <button
                    type="button"
                    class={mobileAccountsBtnClass}
                    role="tab"
                    aria-selected={isMobileAccountsTab}
                    onclick={handleSelectMobileAccounts}
                >
                    Accounts ({totalAccountCount})
                </button>
            </div>

            <div class="planner-body" data-mobile-sub-view={mobileSubView}>
                <aside class="planner-sidebar">
                    <div class="sidebar-section-title">Accounts — drag to calendar</div>
                    <div class="slds-p-horizontal_small slds-p-bottom_x-small account-filters">
                        <div class="account-filters-toolbar">
                            <lightning-input
                                class="account-search-input"
                                type="search"
                                label="Search accounts"
                                variant="label-hidden"
                                placeholder={accountSearchPlaceholder}
                                value={accountSearch}
                                onchange={handleAccountSearch}
                                disabled={accountSearchDisabled}
                            ></lightning-input>
                            <button
                                type="button"
                                class={filterFunnelButtonClass}
                                title="Filter accounts"
                                aria-expanded={showAccountFilterPanel}
                                aria-label="Filter accounts"
                                onclick={handleToggleAccountFilters}
                                disabled={accountFiltersDisabled}
                            >
                                <lightning-icon icon-name="utility:filterList" size="x-small"></lightning-icon>
                                <template if:true={activeDropdownFilterCount}>
                                    <span class="filter-funnel-badge">{activeDropdownFilterCount}</span>
                                </template>
                            </button>
                        </div>

                        <template if:true={showCompactFilterSummary}>
                            <div class="active-filter-row">
                                <template for:each={activeFilterChips} for:item="chip">
                                    <span key={chip.key} class="active-filter-chip">{chip.label}</span>
                                </template>
                                <button class="clear-filters-link" type="button" onclick={handleClearAccountFilters}>
                                    Clear
                                </button>
                            </div>
                        </template>
                        <div class="account-count-label">{accountCountLabel}</div>
                        <template if:true={canSaveFilterAsCollection}>
                            <button type="button" class="save-collection-link" onclick={handleOpenSaveCollectionModal}>
                                Save filter as list
                            </button>
                        </template>
                    </div>

                    <div class="account-collections">
                        <div class="sidebar-section-title collections-section-title">My lists</div>
                        <div class="collection-chips-row">
                            <button type="button" class={allAccountsChipClass} onclick={handleShowAllAccounts}>
                                All accounts
                            </button>
                            <template for:each={collectionChips} for:item="col">
                                <button
                                    key={col.id}
                                    type="button"
                                    class={col.chipClass}
                                    data-collection-id={col.id}
                                    onclick={handleSelectCollection}
                                    title={col.title}
                                    ondragover={handleCollectionChipDragOver}
                                    ondrop={handleCollectionChipDrop}
                                >
                                    {col.label}
                                </button>
                            </template>
                            <button
                                type="button"
                                class="collection-chip collection-chip-add"
                                title="New empty list"
                                onclick={handleCreateEmptyCollection}
                            >
                                +
                            </button>
                        </div>
                        <template if:true={showCollectionDropZone}>
                            <div
                                class="collection-drop-zone"
                                ondragover={handleCollectionDropZoneDragOver}
                                ondrop={handleCollectionDropZoneDrop}
                            >
                                Drop accounts here to add to “{selectedCollectionName}”
                            </div>
                            <div class="collection-actions">
                                <button type="button" class="rename-collection-link" onclick={handleOpenRenameCollectionModal}>
                                    Rename list
                                </button>
                                <span class="collection-actions-separator" aria-hidden="true">·</span>
                                <button type="button" class="delete-collection-link" onclick={handleDeleteSelectedCollection}>
                                    Delete list
                                </button>
                            </div>
                        </template>
                    </div>

                    <div class="account-list" style={accountListStyle} onscroll={handleAccountListScroll}>
                        <template for:each={displayAccounts} for:item="account">
                            <div
                                key={account.id}
                                class={account.chipClass}
                                title={account.chipTitle}
                                draggable={accountChipDraggable}
                                data-account-id={account.id}
                                onclick={handleAccountChipClick}
                                ondragstart={handleAccountDragStart}
                                ondragend={handleSidebarDragEnd}
                                ontouchstart={handleAccountTouchStart}
                            >
                                <span class={account.typeIconClass} title={account.typeIconLabel} aria-hidden="true">
                                    <template if:true={account.typeIconUrl}>
                                        <img class="account-type-glyph" src={account.typeIconUrl} alt="" />
                                    </template>
                                    <template if:false={account.typeIconUrl}>
                                        <lightning-icon
                                            icon-name={account.typeIconName}
                                            size="x-small"
                                            alternative-text={account.typeIconLabel}
                                        ></lightning-icon>
                                    </template>
                                </span>
                                <span class="account-chip-body">
                                    <span class="account-chip-name">{account.name}</span>
                                    <span class="account-chip-meta">{account.metaLine}</span>
                                </span>
                                <span class="account-chip-aside">
                                    <template if:true={account.coverageLabel}>
                                        <span class={account.coverageBadgeClass}>{account.coverageLabel}</span>
                                    </template>
                                    <template if:true={account.footnoteLine}>
                                        <span class="account-card-footnote">{account.footnoteLine}</span>
                                    </template>
                                </span>
                            </div>
                        </template>
                        <template if:true={isLoadingAccounts}>
                            <div class="account-loading">
                                <lightning-spinner alternative-text="Loading accounts" size="small"></lightning-spinner>
                            </div>
                        </template>
                        <template if:false={hasAccounts}>
                            <template if:false={isLoadingAccounts}>
                                <div class="empty-hint">{emptyAccountsHint}</div>
                            </template>
                        </template>
                        <template if:true={showAccountLoadMore}>
                            <button type="button" class="load-more-hint" onclick={handleLoadMoreAccounts}>
                                Load more accounts
                            </button>
                        </template>
                    </div>
                </aside>

                <section class="planner-main">
                    <template if:true={showAccountFilterPanel}>
                        <div class="main-overlay-backdrop" onclick={handleCloseAccountFilters}></div>
                        <div class="main-overlay-panel account-filter-panel" onclick={handleFilterPanelClick}>
                            <div class="account-filter-panel-header">
                                <span class="account-filter-panel-title">Filter accounts</span>
                                <button
                                    type="button"
                                    class="account-filter-panel-close"
                                    title="Close filters"
                                    onclick={handleCloseAccountFilters}
                                >
                                    <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                </button>
                            </div>
                            <div class="account-filter-panel-body">
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Record type</label>
                                    <lightning-combobox
                                        label="Record type"
                                        variant="label-hidden"
                                        placeholder="All types"
                                        value={accountRecordType}
                                        options={recordTypeOptions}
                                        onchange={handleRecordTypeChange}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Specialty</label>
                                    <lightning-combobox
                                        label="Specialty"
                                        variant="label-hidden"
                                        placeholder="All specialties"
                                        value={accountSpecialty}
                                        options={specialtyOptions}
                                        onchange={handleSpecialtyChange}
                                        disabled={specialtyFilterDisabled}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Classification</label>
                                    <lightning-combobox
                                        label="Classification"
                                        variant="label-hidden"
                                        placeholder="All classes"
                                        value={accountClassification}
                                        options={classificationOptions}
                                        onchange={handleClassificationChange}
                                        disabled={classificationFilterDisabled}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">148 brick</label>
                                    <lightning-combobox
                                        label="148 brick"
                                        variant="label-hidden"
                                        value={accountBrick148}
                                        options={brick148FilterOptions}
                                        onchange={handleBrick148Change}
                                        disabled={brick148FilterDisabled}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">702 brick</label>
                                    <lightning-combobox
                                        label="702 brick"
                                        variant="label-hidden"
                                        value={accountBrick702}
                                        options={brick702FilterOptions}
                                        onchange={handleBrick702Change}
                                        disabled={brick702FilterDisabled}
                                    ></lightning-combobox>
                                </div>
                                <div class="account-filter-field">
                                    <label class="account-filter-label">Visit this week</label>
                                    <lightning-combobox
                                        label="Visit this week"
                                        variant="label-hidden"
                                        value={visitCoverage}
                                        options={visitCoverageOptions}
                                        onchange={handleVisitCoverageChange}
                                    ></lightning-combobox>
                                </div>
                            </div>
                            <div class="account-filter-panel-footer">
                                <button type="button" class="clear-filters-link" onclick={handleClearAccountFilters}>
                                    Clear all
                                </button>
                                <lightning-button
                                    label="Done"
                                    variant="brand"
                                    onclick={handleCloseAccountFilters}
                                ></lightning-button>
                            </div>
                        </div>
                    </template>

                    <template if:true={showPlanningPalettePanel}>
                        <div
                            class="main-overlay-backdrop"
                            onclick={handleClosePlanningPalette}
                            ondragover={handleDragOver}
                            ondrop={handleCalendarDrop}
                        ></div>
                        <div class="main-overlay-panel planning-palette-panel" onclick={handleFilterPanelClick}>
                            <div class="account-filter-panel-header">
                                <span class="account-filter-panel-title">Add to calendar</span>
                                <button
                                    type="button"
                                    class="account-filter-panel-close"
                                    title="Close"
                                    onclick={handleClosePlanningPalette}
                                >
                                    <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                </button>
                            </div>
                            <div class="planning-palette-body">
                                <template if:true={showPlannerMeetingSection}>
                                <div class="planning-palette-section-title">Meeting</div>
                                <div class="sidebar-helper-text">Drag onto a time slot, or tap to plan one now.</div>
                                <div
                                    class="meeting-palette-item"
                                    draggable="true"
                                    data-drag-type="meeting"
                                    ondragstart={handleMeetingDragStart}
                                    ondragend={handleSidebarDragEnd}
                                    onclick={handleNewMeetingClick}
                                >
                                    <span class="meeting-palette-item__icon" aria-hidden="true">
                                        <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg>
                                    </span>
                                    <span class="meeting-palette-item__text">
                                        <span class="meeting-palette-item__title">New meeting</span>
                                        <span class="meeting-palette-item__desc">Department approval, invites, and costs</span>
                                    </span>
                                </div>
                                </template>
                                <template if:true={showPlannerTimeOffSection}>
                                <div class="planning-palette-section-title">Time Off (TOT)</div>
                                <div class="sidebar-helper-text">Drag a preset to submit instantly, or use Custom for more options.</div>
                                <div class="tot-quick-grid">
                                    <template for:each={totQuickPresets} for:item="preset">
                                        <div
                                            key={preset.id}
                                            class="tot-quick-item"
                                            draggable="true"
                                            data-preset-id={preset.id}
                                            data-drag-type="tot"
                                            ondragstart={handleQuickTotDragStart}
                                            ondragend={handleSidebarDragEnd}
                                            ontouchstart={handleQuickTotTouchStart}
                                            onclick={handleTotPresetClick}
                                        >
                                            {preset.label}
                                        </div>
                                    </template>
                                </div>
                                <div
                                    class="tot-palette-item tot-palette-item-custom"
                                    draggable="true"
                                    data-drag-type="tot"
                                    ondragstart={handleTotDragStart}
                                    ondragend={handleSidebarDragEnd}
                                    ontouchstart={handleTotTouchStart}
                                    onclick={handleCustomTotClick}
                                >
                                    Custom TOT…
                                </div>
                                </template>
                            </div>
                            <div class="account-filter-panel-footer">
                                <span class="planning-palette-hint">Drag items onto the calendar to schedule.</span>
                                <lightning-button
                                    label="Done"
                                    variant="brand"
                                    onclick={handleClosePlanningPalette}
                                ></lightning-button>
                            </div>
                        </div>
                    </template>
                    <template if:true={isCalendarView}>
                        <div class="calendar-view">
                            <div
                                class="calendar-scroll"
                                ondragover={handleDragOver}
                                ondrop={handleCalendarDrop}
                                ontouchmove={handleCalendarTouchMove}
                            >
                                <div class="calendar-canvas" style={gridStyle}>
                                <div class="calendar-grid">
                                    <div class="calendar-header-cell"></div>
                                    <template for:each={weekDays} for:item="day">
                                        <div key={day.key} class={day.headerClass}>
                                            <div>{day.label}</div>
                                            <div class="slds-text-body_small">{day.dateLabel}</div>
                                            <template if:true={day.isHoliday}>
                                                <div class="calendar-holiday-label">{day.holidayLabel}</div>
                                            </template>
                                        </div>
                                    </template>

                                    <template for:each={timeRows} for:item="row">
                                        <template if:true={row.isDayEnd}>
                                            <div key={row.key} class={row.gutterClass} style={row.style}>
                                                <span class="time-gutter-label">{row.label}</span>
                                            </div>
                                        </template>
                                        <template if:false={row.isDayEnd}>
                                            <div key={row.key} class={row.gutterClass} style={row.style}>{row.label}</div>
                                        </template>
                                        <template for:each={row.dayCells} for:item="cell">
                                            <div
                                                key={cell.key}
                                                class={cell.columnClass}
                                                style={cell.style}
                                                data-day-key={cell.dayKey}
                                                data-minutes={cell.minutes}
                                                onclick={handleSlotClick}
                                            ></div>
                                        </template>
                                    </template>

                                </div>
                                <div class="calendar-events-layer">
                                    <template for:each={calendarEvents} for:item="event">
                                        <div
                                            key={event.key}
                                            class={event.blockClass}
                                            style={event.style}
                                            draggable={event.draggable}
                                            data-event-id={event.id}
                                            data-event-type={event.type}
                                            title={event.clickHint}
                                            ondragstart={handleEventDragStart}
                                            ondragend={handleEventDragEnd}
                                            onclick={handleEventClick}
                                        >
                                            <div class="event-title">
                                                <template if:true={event.showOutlierWarning}>
                                                    <span class="calendar-outlier-indicator" title="Far from other stops on this day">!</span>
                                                </template>
                                                {event.title}
                                            </div>
                                            <template if:false={event.compact}>
                                                <div class="event-time">{event.timeLabel}</div>
                                            </template>
                                            <template if:true={event.resizable}>
                                                <div
                                                    class="resize-handle"
                                                    data-event-id={event.id}
                                                    data-event-type={event.type}
                                                    title="Drag to change duration"
                                                    onpointerdown={handleResizeStart}
                                                ></div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                                </div>
                            </div>
                        </div>
                    </template>

                    <template if:true={isMapView}>
                        <div class="map-view">
                            <div class="map-layout">
                                <div class="map-container" lwc:dom="manual"></div>
                                <div class="map-sidebar">
                                    <div class="sidebar-section-title">Route stops</div>
                                    <div class="map-account-count">{mapAccountCountLabel}</div>
                                    <template if:true={hasRouteOutliers}>
                                        <div class="route-suggestion-card route-outlier-card">
                                            <div class="route-suggestion-title">Distant stops</div>
                                            <p class="route-outlier-summary">{distantStopsSummary}</p>
                                            <ul class="route-suggestion-hints">
                                                <template for:each={decoratedRouteOutliers} for:item="outlier">
                                                    <li key={outlier.visitId} class="route-outlier-item">
                                                        <div>
                                                            <strong>{outlier.accountName}</strong> — {outlier.awayLabel}
                                                        </div>
                                                        <template if:true={outlier.canAct}>
                                                            <div class="route-stop-actions slds-m-top_x-small">
                                                                <lightning-button
                                                                    variant="neutral"
                                                                    label="Postpone to tomorrow"
                                                                    data-visit-id={outlier.visitId}
                                                                    onclick={handleRouteStopPostpone}
                                                                    disabled={isSaving}
                                                                ></lightning-button>
                                                                <lightning-button
                                                                    variant="destructive-text"
                                                                    label="Remove visit"
                                                                    data-visit-id={outlier.visitId}
                                                                    onclick={handleRouteStopRemove}
                                                                    disabled={isSaving}
                                                                ></lightning-button>
                                                            </div>
                                                        </template>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                    <template if:true={hasOptimizationIdeas}>
                                        <div class="ideas-panel map-ideas-panel">
                                            <div class="route-suggestion-title">Optimization ideas</div>
                                            <ul class="ideas-list">
                                                <template for:each={optimizationIdeas} for:item="idea">
                                                    <li key={idea.id} class={idea.itemClass}>
                                                        <lightning-icon
                                                            icon-name={idea.iconName}
                                                            size="x-small"
                                                            class={idea.iconClass}
                                                            alternative-text="Tip"
                                                        ></lightning-icon>
                                                        <div class="ideas-content">
                                                            <span class="ideas-text">{idea.text}</span>
                                                        </div>
                                                    </li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                    <template for:each={sidebarRouteStops} for:item="stop">
                                        <div
                                            key={stop.id}
                                            class={stop.stopClass}
                                            data-stop-id={stop.id}
                                            onclick={handleRouteStopClick}
                                        >
                                            <template if:true={stop.canReorder}>
                                                <div class="route-reorder-buttons">
                                                    <lightning-button-icon
                                                        icon-name="utility:up"
                                                        alternative-text="Move up"
                                                        data-visit-id={stop.id}
                                                        data-direction="up"
                                                        onclick={handleMoveRouteStop}
                                                        disabled={stop.moveUpDisabled}
                                                        variant="bare"
                                                        size="small"
                                                    ></lightning-button-icon>
                                                    <lightning-button-icon
                                                        icon-name="utility:down"
                                                        alternative-text="Move down"
                                                        data-visit-id={stop.id}
                                                        data-direction="down"
                                                        onclick={handleMoveRouteStop}
                                                        disabled={stop.moveDownDisabled}
                                                        variant="bare"
                                                        size="small"
                                                    ></lightning-button-icon>
                                                </div>
                                            </template>
                                            <span class={stop.orderClass}>{stop.orderLabel}</span>
                                            <div class="route-stop-body">
                                                <div class="slds-text-title_caps">{stop.accountName}</div>
                                                <template if:false={stop.isCurrentLocation}>
                                                    <div class="route-stop-type">{stop.accountTypeLabel}</div>
                                                </template>
                                                <div>{stop.timeLabel}</div>
                                                <template if:true={stop.arrivalStatusLabel}>
                                                    <div class={stop.arrivalStatusClass}>{stop.arrivalStatusLabel}</div>
                                                </template>
                                                <template if:true={stop.isOutlier}>
                                                    <div class="route-outlier-badge">Route outlier</div>
                                                </template>
                                                <template if:false={stop.hasLocation}>
                                                    <div class="slds-text-color_error">No geocode on account</div>
                                                </template>
                                                <template if:true={stop.canMutate}>
                                                    <div class="route-stop-actions slds-m-top_x-small">
                                                        <lightning-button
                                                            variant="base"
                                                            label="Postpone"
                                                            data-visit-id={stop.id}
                                                            onclick={handleRouteStopPostpone}
                                                            disabled={isSaving}
                                                        ></lightning-button>
                                                        <lightning-button
                                                            variant="base"
                                                            label="Remove"
                                                            data-visit-id={stop.id}
                                                            onclick={handleRouteStopRemove}
                                                            disabled={isSaving}
                                                        ></lightning-button>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    <template if:true={hasRouteOptimization}>
                                        <div class="route-suggestion-card">
                                            <div class="route-suggestion-title">Suggested route order</div>
                                            <div class="route-suggestion-savings">
                                                Saves <strong>{routeOptimization.savingsMin}</strong> min
                                                (<strong>{routeOptimization.savingsKm}</strong> km)
                                            </div>
                                            <ul class="route-suggestion-hints">
                                                <template for:each={routeOptimization.swapHints} for:item="hint">
                                                    <li key={hint}>{hint}</li>
                                                </template>
                                            </ul>
                                            <lightning-button
                                                class="slds-m-top_x-small"
                                                label="Apply suggested order"
                                                variant="brand"
                                                onclick={handleApplySuggestedOrder}
                                                disabled={isUpdatingRoute}
                                            ></lightning-button>
                                        </div>
                                    </template>
                                    <template if:false={hasMapStops}>
                                        <div class="empty-hint">No geocoded visits on this day.</div>
                                    </template>
                                    <template if:true={routeSummary}>
                                        <div class="route-summary">
                                            <div><strong>Route:</strong> {routeSummary.distanceKm} km · {routeSummary.durationMin} min drive</div>
                                            <template if:true={hasRouteEstCost}>
                                                <div class="slds-m-top_xx-small">Est. cost: {routeSummary.estCost}</div>
                                            </template>
                                            <div class="slds-m-top_x-small arrival-summary">{arrivalSummaryLabel}</div>
                                        </div>
                                    </template>
                                    <template if:true={hasRouteAlternatives}>
                                        <div class="route-options-card">
                                            <div class="route-suggestion-title">Route options</div>
                                            <lightning-radio-group
                                                options={routeAlternativeRadioOptions}
                                                value={selectedRouteId}
                                                type="radio"
                                                onchange={handleRouteAlternativeChange}
                                            ></lightning-radio-group>
                                        </div>
                                    </template>
                                    <template if:true={hasVisitSuggestions}>
                                        <div class="visit-suggestions-card">
                                            <div class="route-suggestion-title">Suggested visits</div>
                                            <template for:each={visitSuggestions} for:item="suggestion">
                                                <div key={suggestion.id} class="visit-suggestion-item">
                                                    <div class="slds-text-title_caps">{suggestion.accountName}</div>
                                                    <div>{suggestion.placementLabel} · +{suggestion.detourMin} min</div>
                                                    <div>{suggestion.visitGapLabel} · {suggestion.frequencyStatus}</div>
                                                    <div class="slds-m-top_x-small">
                                                        <lightning-button
                                                            label="Add to route"
                                                            data-account-id={suggestion.accountId}
                                                            onclick={handleAddSuggestionToRoute}
                                                        ></lightning-button>
                                                        <lightning-button
                                                            class="slds-m-left_x-small"
                                                            label="Plan visit"
                                                            data-account-id={suggestion.accountId}
                                                            onclick={handlePlanSuggestionVisit}
                                                        ></lightning-button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <div class="slds-m-top_medium slds-text-body_small map-legend">
                                        <span class="legend-dot" style="background:#0176d3"></span> You
                                        <span class="legend-pin legend-pin-hcp slds-m-left_small"></span> Planned HCP
                                        <span class="legend-pin legend-pin-hco slds-m-left_small"></span> Planned HCO
                                        <span class="legend-pin legend-pin-pharmacy slds-m-left_small"></span> Planned Pharmacy
                                        <span class="legend-pin legend-pin-outlier slds-m-left_small"></span> Outlier
                                        <span class="legend-pin legend-pin-unplanned slds-m-left_small"></span> Unplanned
                                        <span class="legend-dot slds-m-left_small" style="background:#2e7d32"></span> Route
                                        <span class="legend-dot slds-m-left_small legend-dot-alt"></span> Alt route
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </section>
            </div>
        </div>

        <template if:true={showVisitDetailModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="visitDetail"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan Visit</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-title_caps slds-m-bottom_x-small">{visitDetailAccountName}</p>
                        <lightning-input
                            class="slds-m-bottom_small"
                            type="datetime"
                            label="Visit start date &amp; time"
                            value={visitDetailStartDateTime}
                            onchange={handleVisitDetailStartChange}
                            disabled={visitDetailReadOnly}
                            required
                        ></lightning-input>
                        <lightning-input
                            class="slds-m-bottom_medium"
                            type="datetime"
                            label="Visit end date &amp; time"
                            value={visitDetailEndDateTime}
                            onchange={handleVisitDetailEndChange}
                            disabled={visitDetailReadOnly}
                            required
                        ></lightning-input>
                        <lightning-combobox
                            label="Status"
                            value={visitDetailStatus}
                            options={visitStatusOptions}
                            onchange={handleVisitDetailStatusChange}
                            disabled={visitDetailReadOnly}
                            required
                        ></lightning-combobox>
                        <template if:true={visitShowCancellationReason}>
                            <lightning-textarea
                                class="slds-m-top_small"
                                label="Cancellation Reason"
                                value={visitDetailCancellationReason}
                                onchange={handleVisitDetailCancellationChange}
                                disabled={visitDetailReadOnly}
                                required
                            ></lightning-textarea>
                        </template>
                        <template if:true={visitDetailCanManagerApprove}>
                            <lightning-textarea
                                class="slds-m-top_medium"
                                label="Rejection reason"
                                placeholder="Required if you reject this visit"
                                value={managerPlanRejectionReason}
                                onchange={handleManagerPlanRejectionChange}
                            ></lightning-textarea>
                            <p class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                                Submitted for your approval. Approve to schedule it on the rep&apos;s calendar, or reject with a reason so they can revise the plan.
                            </p>
                        </template>
                        <p class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                            <template if:true={visitDetailCanSubmit}>
                                This visit is still a draft. Submit it so your manager can approve the plan.
                            </template>
                            <template if:false={visitDetailCanSubmit}>
                                <template if:false={visitDetailCanManagerApprove}>
                                    Drag accounts onto the calendar to create draft visits. Open a visit here to schedule, complete, or cancel it.
                                </template>
                            </template>
                        </p>
                    </div>
                    <footer class="slds-modal__footer visit-modal-footer">
                        <div class="visit-modal-action-bar" role="group" aria-label="Visit actions">
                            <template if:true={visitDetailCanManagerApprove}>
                                <button
                                    type="button"
                                    class="visit-bar-btn visit-bar-btn-primary"
                                    onclick={handleManagerApproveVisit}
                                    disabled={isSaving}
                                >
                                    Approve visit
                                </button>
                                <button
                                    type="button"
                                    class="visit-bar-btn"
                                    onclick={handleManagerRejectVisit}
                                    disabled={isSaving}
                                >
                                    Reject visit
                                </button>
                                <button
                                    type="button"
                                    class="visit-bar-btn"
                                    onclick={handleViewVisit}
                                >
                                    View visit
                                </button>
                                <button
                                    type="button"
                                    class="visit-bar-btn"
                                    onclick={handleStartCoaching}
                                >
                                    Start coaching
                                </button>
                                <button
                                    type="button"
                                    class="visit-bar-btn"
                                    onclick={handleVisitDetailCancel}
                                >
                                    Close
                                </button>
                            </template>
                            <template if:true={visitDetailCanSubmit}>
                                <button
                                    type="button"
                                    class="visit-bar-btn visit-bar-btn-primary"
                                    onclick={handleSubmitVisitForApproval}
                                    disabled={isSaving}
                                >
                                    Submit for approval
                                </button>
                            </template>
                            <template if:false={visitDetailCanManagerApprove}>
                                <template if:false={visitDetailCanSubmit}>
                                    <button
                                        type="button"
                                        class="visit-bar-btn visit-bar-btn-primary"
                                        onclick={handleViewVisit}
                                    >
                                        View Visit
                                    </button>
                                    <template if:true={visitDetailCanCoach}>
                                        <button
                                            type="button"
                                            class="visit-bar-btn"
                                            onclick={handleStartCoaching}
                                        >
                                            Start coaching
                                        </button>
                                    </template>
                                </template>
                            </template>
                            <template if:false={visitDetailCanManagerApprove}>
                                <template if:false={visitDetailReadOnly}>
                                    <button
                                        type="button"
                                        class="visit-bar-btn"
                                        onclick={handleVisitDetailSave}
                                        disabled={isSaving}
                                    >
                                        Save
                                    </button>
                                </template>
                                <button
                                    type="button"
                                    class="visit-bar-btn"
                                    onclick={handleVisitDetailCancel}
                                >
                                    Close
                                </button>
                            </template>
                            <template if:true={visitDetailCanMutate}>
                                <div class="visit-bar-more">
                                    <button
                                        type="button"
                                        class="visit-bar-btn visit-bar-more-toggle"
                                        title="More actions"
                                        aria-label="More actions"
                                        aria-haspopup="menu"
                                        aria-expanded={showVisitMoreMenu}
                                        onclick={handleToggleVisitMoreMenu}
                                        disabled={isSaving}
                                    >
                                        ⋯
                                    </button>
                                    <template if:true={showVisitMoreMenu}>
                                        <div class="visit-bar-menu" role="menu">
                                            <template if:true={visitDetailCanSubmit}>
                                                <button
                                                    type="button"
                                                    class="visit-bar-menu-item"
                                                    role="menuitem"
                                                    onclick={handleViewVisit}
                                                >
                                                    View visit record
                                                </button>
                                            </template>
                                            <button
                                                type="button"
                                                class="visit-bar-menu-item"
                                                role="menuitem"
                                                onclick={handleVisitDetailPostpone}
                                                disabled={isSaving}
                                            >
                                                Postpone to tomorrow
                                            </button>
                                            <button
                                                type="button"
                                                class="visit-bar-menu-item visit-bar-menu-danger"
                                                role="menuitem"
                                                onclick={handleVisitDetailRemove}
                                                disabled={isSaving}
                                            >
                                                Remove visit
                                            </button>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showPlanChoiceModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="planChoice"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container plan-choice-modal" onclick={stopPlannerModalContentClick}>
                    <div class="plan-choice">
                        <header class="plan-choice__head">
                            <div class="plan-choice__slot">
                                <span class="plan-choice__eyebrow">Plan this time slot</span>
                                <span class="plan-choice__day">{pendingSlotDayLabel}</span>
                                <span class="plan-choice__time">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
                                    {pendingSlotTimeLabel}
                                </span>
                            </div>
                            <button type="button" class="plan-choice__close" aria-label="Close" onclick={handlePlanChoiceCancel}>
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
                            </button>
                        </header>
                        <div class="plan-choice__options" role="list">
                            <button type="button" class="plan-option plan-option_visit" role="listitem" onclick={handlePlanVisitChoice}>
                                <span class="plan-option__icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                </span>
                                <span class="plan-option__text">
                                    <span class="plan-option__title">Visit</span>
                                    <span class="plan-option__desc">Call on an HCP, pharmacy, or hospital</span>
                                </span>
                                <svg class="plan-option__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
                            </button>
                            <button type="button" class="plan-option plan-option_meeting" role="listitem" onclick={handlePlanMeetingChoice}>
                                <span class="plan-option__icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.9"></path><path d="M16 3.1a4 4 0 0 1 0 7.8"></path></svg>
                                </span>
                                <span class="plan-option__text">
                                    <span class="plan-option__title">Meeting</span>
                                    <span class="plan-option__desc">Speaker dinner, round table, seminar, or promotional activity, with approval and costs</span>
                                </span>
                                <svg class="plan-option__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
                            </button>
                            <button type="button" class="plan-option plan-option_tot" role="listitem" onclick={handlePlanTotChoice}>
                                <span class="plan-option__icon">
                                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
                                </span>
                                <span class="plan-option__text">
                                    <span class="plan-option__title">Time off</span>
                                    <span class="plan-option__desc">Leave, training, or office time</span>
                                </span>
                                <svg class="plan-option__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showVisitModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="visit"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan a Visit</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">
                            <strong>Start:</strong> {pendingSlotLabel}
                            <span class="slds-m-left_small"><strong>End:</strong> {visitEndLabel}</span>
                        </p>
                        <c-field-account-lookup
                            label="Account"
                            placeholder="Search a name in Arabic or English"
                            required
                            invalid={visitAccountInvalid}
                            account-id={visitAccountId}
                            account-name={visitAccountName}
                            icon-name={visitAccountIconName}
                            record-type-label={visitAccountRecordTypeLabel}
                            suggestions={visitAccountSuggestions}
                            onchange={handleVisitAccountLookupChange}
                        ></c-field-account-lookup>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleVisitCancel}></lightning-button>
                        <lightning-button label="Save Visit" variant="brand" onclick={handleVisitSave} disabled={isSaving}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showVisitPickerModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="visitPicker"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Select a visit</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small slds-text-body_regular">
                            Multiple visits are scheduled for this account. Choose one to open.
                        </p>
                        <ul class="visit-picker-list">
                            <template for:each={visitPickerOptions} for:item="option">
                                <li key={option.id} class="visit-picker-item">
                                    <button
                                        class="visit-picker-button"
                                        data-visit-id={option.id}
                                        onclick={handleVisitPickerSelect}
                                    >
                                        <span class="visit-picker-label">{option.label}</span>
                                        <span class="visit-picker-status">{option.status}</span>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleVisitPickerCancel}></lightning-button>
                    </footer>
                </div>
            </section>
