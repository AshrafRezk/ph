            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showTotModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="tot"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container tot-modal" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Create Time Off (TOT)</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-body_small slds-m-bottom_small slds-text-color_weak">
                            Pick a quick preset or adjust the details below, then submit.
                        </p>
                        <div class="tot-preset-row">
                            <template for:each={totQuickPresets} for:item="preset">
                                <button
                                    key={preset.id}
                                    type="button"
                                    class="tot-preset-chip"
                                    data-preset-id={preset.id}
                                    onclick={handleTotPresetClick}
                                >
                                    {preset.label}
                                </button>
                            </template>
                        </div>
                        <lightning-combobox
                            data-tot-field="type"
                            label="Type"
                            value={totTypeValue}
                            options={totTypeOptions}
                            onchange={handleTotTypeChange}
                            required
                        ></lightning-combobox>
                        <lightning-combobox
                            data-tot-field="span"
                            class="slds-m-top_small"
                            label="Span"
                            value={totSpanType}
                            options={totSpanOptions}
                            onchange={handleTotSpanChange}
                            required
                        ></lightning-combobox>
                        <template if:true={totIsHoursSpan}>
                            <lightning-combobox
                                data-tot-field="duration"
                                class="slds-m-top_small"
                                label="Duration (hours)"
                                value={totDurationHours}
                                options={totDurationOptions}
                                onchange={handleTotDurationChange}
                                required
                            ></lightning-combobox>
                            <lightning-input
                                data-tot-field="start-datetime"
                                class="slds-m-top_small"
                                type="datetime"
                                label="Start date &amp; time"
                                value={totStartDateTime}
                                onchange={handleTotStartChange}
                                required
                            ></lightning-input>
                        </template>
                        <template if:true={totIsFullDaySpan}>
                            <lightning-input
                                data-tot-field="start-date"
                                class="slds-m-top_small"
                                type="date"
                                label="Date"
                                value={totStartDate}
                                onchange={handleTotStartDateChange}
                                required
                            ></lightning-input>
                        </template>
                        <lightning-textarea
                            class="slds-m-top_small"
                            label="Comments"
                            value={totComments}
                            onchange={handleTotCommentsChange}
                        ></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleTotCancel}></lightning-button>
                        <lightning-button label="Save Draft" onclick={handleTotSaveDraft} disabled={isSaving}></lightning-button>
                        <lightning-button label="Submit" variant="brand" onclick={handleTotSubmit} disabled={totSubmitDisabled}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showRenameCollectionModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="renameCollection"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container save-collection-modal" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Rename account list</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            label="List name"
                            placeholder="e.g. Tier A HCPs in Cairo"
                            value={renameCollectionName}
                            onchange={handleRenameCollectionNameChange}
                            required
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleRenameCollectionCancel}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="Save"
                            variant="brand"
                            onclick={handleRenameCollectionConfirm}
                            disabled={isRenameCollectionDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showSaveCollectionModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="saveCollection"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container save-collection-modal" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Save as account list</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small slds-text-body_small">
                            Saves all accounts matching your current filters ({saveCollectionAccountCountLabel}).
                        </p>
                        <lightning-input
                            label="List name"
                            placeholder="e.g. Tier A HCPs in Cairo"
                            value={saveCollectionName}
                            onchange={handleSaveCollectionNameChange}
                            required
                        ></lightning-input>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handleSaveCollectionCancel}></lightning-button>
                        <lightning-button
                            class="slds-m-left_x-small"
                            label="Save list"
                            variant="brand"
                            onclick={handleSaveCollectionConfirm}
                            disabled={isSaveCollectionDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showPromoModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="promo"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Plan Promotional Event</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-m-bottom_small">
                            <strong>Start:</strong> {pendingSlotLabel}
                            <span class="slds-m-left_small"><strong>End:</strong> {promoEndLabel}</span>
                        </p>
                        <lightning-combobox
                            label="Promotional project"
                            placeholder="Select a project"
                            value={promoProjectId}
                            options={promoProjectOptions}
                            onchange={handlePromoProjectChange}
                            required
                        ></lightning-combobox>
                        <lightning-input
                            class="slds-m-top_small"
                            label="Event title"
                            placeholder="e.g. Pharmacy open day, product launch"
                            value={promoTitle}
                            onchange={handlePromoTitleChange}
                            required
                        ></lightning-input>
                        <p class="slds-m-top_medium slds-text-body_small slds-text-color_weak">
                            Promotional events appear on your calendar and link to the selected project.
                        </p>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Cancel" onclick={handlePromoCancel}></lightning-button>
                        <lightning-button
                            label="Save Event"
                            variant="brand"
                            onclick={handlePromoSave}
                            disabled={isPromoSaveDisabled}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showPlanApprovalModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="planApproval"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Manager approval</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-title_caps slds-m-bottom_small">{planApprovalTitle}</p>
                        <lightning-textarea
                            label="Rejection reason"
                            placeholder="Required if you reject this item"
                            value={planApprovalRejectionReason}
                            onchange={handlePlanApprovalRejectionChange}
                        ></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Close" onclick={handlePlanApprovalCancel}></lightning-button>
                        <lightning-button
                            label="Reject"
                            onclick={handlePlanApprovalReject}
                            disabled={isSaving}
                        ></lightning-button>
                        <lightning-button
                            label="Approve"
                            variant="brand"
                            onclick={handlePlanApprovalApprove}
                            disabled={isSaving}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={showMeetingPanel}>
            <div class="meeting-drawer" onclick={handleMeetingPanelShellClick}>
                <div class="meeting-drawer__panel" role="dialog" aria-modal="true" aria-label="Meeting">
                    <c-meeting-workspace
                        meeting-id={meetingPanelId}
                        default-start={meetingPanelStart}
                        default-end={meetingPanelEnd}
                        embedded
                        onclose={handleMeetingPanelClose}
                        onchanged={handleMeetingPanelChanged}
                        oncreated={handleMeetingPanelCreated}
                    ></c-meeting-workspace>
                </div>
            </div>
        </template>

        <template if:true={showMeetingExpenseModal}>
            <section
                role="dialog"
                tabindex="-1"
                class={plannerModalClass}
                data-modal="meetingExpense"
                onclick={handlePlannerModalShellClick}
            >
                <div class="slds-modal__container" onclick={stopPlannerModalContentClick}>
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Meeting expenses</h2>
                        <p class="slds-text-body_small slds-m-top_x-small">{meetingExpenseTitle}</p>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <c-planner-meeting-expenses meeting-id={meetingExpenseId}></c-planner-meeting-expenses>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Open meeting" onclick={handleOpenMeetingRecord}></lightning-button>
                        <lightning-button class="slds-m-left_x-small" label="Close" variant="brand" onclick={handleMeetingExpenseClose}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class={plannerBackdropClass}></div>
        </template>

        <template if:true={renderAgentforceFab}>
        <div class="agentforce-fab-root" style={agentforceFabStyle}>
            <template if:true={showPlannerInsights}>
                <section class="agentforce-popup" role="dialog" aria-label="Planner Agentforce">
                    <header class="agentforce-popup-header">
                        <div>
                            <div class="agentforce-popup-title">Agentforce</div>
                            <div class="agentforce-popup-sub">Recommendations, insights &amp; Q&amp;A</div>
                        </div>
                        <button type="button" class="agentforce-popup-close" onclick={handleCloseAgentforcePopup} aria-label="Close">
                            ×
                        </button>
                    </header>

                    <div class="agentforce-section">
                        <div class="agentforce-section-title">
                            Week recommendations
                            <span class="agentforce-section-meta">{weekForecastLabel}</span>
                        </div>
                        <template if:true={isLoadingRecommendations}>
                            <p class="slds-text-body_small">Loading recommendations…</p>
                        </template>
                        <template if:true={hasWeekRecommendations}>
                            <ul class="planner-rec-list agentforce-rec-list">
                                <template for:each={weekRecommendations} for:item="rec">
                                    <li key={rec.key} class="planner-rec-item">
                                        <div>
                                            <div class="planner-rec-title">{rec.accountName}</div>
                                            <div class="planner-rec-meta">{rec.gapLabel}</div>
                                            <div class="planner-rec-reason">{rec.reason}</div>
                                        </div>
                                        <lightning-button
                                            label="Add draft"
                                            data-account-id={rec.accountId}
                                            onclick={handlePlanRecommendation}
                                            disabled={isReadOnlyPlannerView}
                                        ></lightning-button>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template if:false={hasWeekRecommendations}>
                            <template if:false={isLoadingRecommendations}>
                                <p class="slds-text-body_small">No open frequency gaps for this week.</p>
                            </template>
                        </template>
                    </div>

                    <div class="agentforce-section">
                        <div class="agentforce-section-title">Insights</div>
                        <ul class="planner-insight-list agentforce-insight-list">
                            <template for:each={plannerInsightLines} for:item="line">
                                <li key={line.key}>{line.text}</li>
                            </template>
                        </ul>
                    </div>

                    <div class="agentforce-section">
                        <div class="agentforce-section-title">Ask about this week</div>
                        <div class="planner-chat">
                            <template for:each={plannerChatMessages} for:item="msg">
                                <div key={msg.key} class={msg.cssClass}>
                                    {msg.text}
                                </div>
                            </template>
                            <lightning-textarea
                                label="Ask Agentforce anything…"
                                value={plannerChatQuestion}
                                onchange={handlePlannerChatQuestionChange}
                                max-length="500"
                            ></lightning-textarea>
                            <lightning-button
                                class="slds-m-top_x-small"
                                label="Ask"
                                variant="brand"
                                onclick={handleAskPlannerQuestion}
                                disabled={isAskingPlanner}
                            ></lightning-button>
                        </div>
                    </div>
                </section>
            </template>
            <div class="agentforce-fab-cluster" onpointerdown={handleAgentforceFabPointerDown}>
                <button
                    type="button"
                    class="agentforce-fab-robot"
                    title="Ask Agentforce"
                    aria-label="Ask Agentforce"
                    onclick={handleAgentforceFabClick}
                >
                    <svg class="agentforce-fab-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            fill="currentColor"
                            d="M12 2a2 2 0 0 1 2 2v1h2a3 3 0 0 1 3 3v2h1a1 1 0 1 1 0 2h-1v2a3 3 0 0 1-3 3h-2v1a2 2 0 1 1-4 0v-1H8a3 3 0 0 1-3-3v-2H4a1 1 0 1 1 0-2h1V8a3 3 0 0 1 3-3h2V4a2 2 0 0 1 2-2zm-3 8a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 9 10zm6 0a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 15 10zm-6.5 4.25h7a.75.75 0 0 1 0 1.5h-7a.75.75 0 0 1 0-1.5z"
                        ></path>
                    </svg>
                </button>
                <button
                    type="button"
                    class="agentforce-fab-menu"
                    title="Agentforce menu"
                    aria-label="Agentforce menu"
                    onclick={handleAgentforceFabClick}
                >
                    ···
                </button>
            </div>
        </div>
        </template>
</template>
