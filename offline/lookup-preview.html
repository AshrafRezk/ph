<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <link rel="stylesheet" href="/src/slds-shim.css" />
        <title>Account lookup preview</title>
        <style>
            body {
                margin: 0;
                font-family: "Salesforce Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #e5e9f0;
                color: #181818;
            }
            .bar {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                padding: 0.75rem;
            }
            button {
                min-height: 2.75rem;
                padding: 0 0.9rem;
                border: 1px solid #0176d3;
                border-radius: 999px;
                background: #fff;
                color: #0176d3;
                font: inherit;
                font-weight: 650;
            }
        </style>
    </head>
    <body>
        <div class="bar">
            <button id="open-request" type="button">New request</button>
            <button id="open-order" type="button">New order</button>
            <button id="open-selected" type="button">Request with account</button>
        </div>
        <script type="module" src="/lookup-preview.js?v=21"></script>
    </body>
</html>
