<template>
    <template if:true={isCheckable}>
        <div class="slds-form-element">
            <label class={checkableClass}>
                <input
                    type="checkbox"
                    name={name}
                    checked={checked}
                    disabled={disabled}
                    onchange={handleCheck}
                />
                <span class="slds-form-element__label">{label}</span>
            </label>
        </div>
    </template>
    <template if:false={isCheckable}>
        <div class="slds-form-element">
            <template if:true={showLabel}>
                <label class="slds-form-element__label">{label}</label>
            </template>
            <div class="slds-form-element__control">
                <input
                    type={actualType}
                    class="slds-input"
                    value={displayValue}
                    placeholder={placeholder}
                    disabled={disabled}
                    required={required}
                    min={min}
                    max={max}
                    step={step}
                    oninput={handleInput}
                    onchange={handleChange}
                />
            </div>
        </div>
    </template>
</template>
