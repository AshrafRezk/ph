<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0176d3" />
    <title>List — Pharma Field PWA</title>
    <link rel="stylesheet" href="shell.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="list.css" />
</head>
<body>
    <p id="list-error" class="error-banner" style="display:none" role="alert"></p>
    <div id="list-loading" class="loading-msg" style="display:none">Loading records…</div>

    <div id="list-result" style="display:none">
        <div class="list-toolbar" role="toolbar" aria-label="List views">
            <button type="button" class="list-view-btn is-active" data-view="table">Tabular</button>
            <button type="button" class="list-view-btn" data-view="kanban">Kanban</button>
            <button type="button" class="list-view-btn" data-view="calendar">Calendar</button>
            <button type="button" class="list-view-btn" data-view="cards">Cards</button>
        </div>
        <div id="list-stage" class="list-stage"></div>
    </div>

    <script type="module" src="list.js"></script>
</body>
</html>
