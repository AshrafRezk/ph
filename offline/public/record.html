<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0176d3" />
    <title data-brand-screen="Record">Record — Salesforce</title>
    <script src="/shell-brand.js"></script>
    <link rel="stylesheet" href="shell.css" />
    <link rel="stylesheet" href="account.css" />
    <link rel="stylesheet" href="record.css" />
</head>
<body>
    <header class="record-header">
        <div class="nav-left">
            <button id="btn-back" class="back-btn" aria-label="Back">←</button>
            <span class="nav-title">Record</span>
        </div>
        <div class="record-header-status">
            <span id="record-version" class="record-version-badge">v62.0</span>
        </div>
    </header>

    <form id="record-form" class="record-form" autocomplete="off">
        <label class="record-field">
            <span class="record-label">Record ID</span>
            <input id="record-id" name="recordId" type="text"
                placeholder="e.g. 0011700000ABCDEFGHI" required spellcheck="false" />
        </label>
        <label class="record-field">
            <span class="record-label">Object (optional — auto-detected)</span>
            <input id="record-object" name="object" type="text"
                placeholder="e.g. Account, Case, Contact" spellcheck="false" />
        </label>
        <button id="btn-load" class="record-load-btn" type="submit">Load record</button>
    </form>

    <p class="record-hint">
        Pulls any record through the Salesforce UI API
        <code>/services/data/v62.0/ui-api/record-ui/&lt;id&gt;</code> and shows fields in
        page-layout order and sections (falls back to a full field dump if no layout
        is available). Field-level security respected.
    </p>

    <div id="record-error" class="error-banner" style="display:none" role="alert"></div>
    <div id="record-loading" class="loading-msg" style="display:none">Loading record…</div>

    <div id="record-result" class="osr-record" style="display:none">
        <header class="osr-record-header">
            <div class="osr-identity">
                <div class="osr-avatar" id="record-icon" aria-hidden="true">—</div>
                <div class="osr-identity-body">
                    <div class="osr-kicker" id="record-object-badge">—</div>
                    <h1 id="record-title" class="osr-title">—</h1>
                    <p id="record-subtitle" class="osr-subtitle"></p>
                    <div id="record-contact" class="osr-contact"></div>
                </div>
                <span id="record-status-pill" class="osr-status-pill" hidden></span>
            </div>
            <div id="record-actions" class="osr-action-bar"></div>
        </header>
        <div id="record-path" class="osr-path" hidden></div>
        <div id="record-sync" class="osr-sync" aria-live="polite"></div>
        <div id="record-tabs" class="osr-tabbar" hidden>
            <button type="button" class="osr-tab is-active" data-tab="overview">Overview</button>
            <button type="button" class="osr-tab" data-tab="activity">Activity</button>
        </div>
        <div class="osr-layout">
            <div class="osr-main">
                <div class="record-toolbar">
                    <input id="record-filter" class="record-filter" type="search"
                        placeholder="Search this record…" spellcheck="false" />
                </div>
                <div id="record-sections" class="record-sections"></div>
                <button type="button" id="record-show-all" class="osr-show-all" hidden>Show all details</button>
                <div id="record-all-details" hidden></div>
                <div class="record-table-wrap" id="record-table-wrap" style="display:none">
                    <table id="record-table" class="record-table">
                        <thead>
                            <tr><th>Field</th><th>Value</th></tr>
                        </thead>
                        <tbody id="record-tbody"></tbody>
                    </table>
                </div>
            </div>
            <aside id="record-activity" class="osr-activity" hidden>
                <h2>Activity</h2>
                <div id="record-activity-list"></div>
            </aside>
        </div>
        <span id="record-id-badge" class="record-highlights-id" hidden></span>
        <span id="record-type-badge" style="display:none"></span>
    </div>

    <script type="module" src="record.js"></script>
</body>
</html>
